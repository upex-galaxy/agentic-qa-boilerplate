# Codex CLI + Desktop read this same file. Instructions come from AGENTS.md and
# skills from .agents/skills/, both natively — neither needs configuring here.
# The MCP inventory below is the Codex-format adapter of the servers that
# .mcp.json and opencode.jsonc also declare; `bun run agents:compat:check`
# compares the three semantically, so a server added to one host only fails.
# Remote servers whose only project-side content was an API key (web search,
# Postman) are not here: connect them at user level (`codex mcp add`, which
# writes ~/.codex/config.toml); skills resolve them by capability.

[shell_environment_policy]
inherit = "core"

# EVERY server below that needs .env values starts through the .env loader:
# `bunx -p varlock@1.20.0 varlock run --no-redact-stdout --inject vars --filter
# A,B -- <the real command>`. Codex Desktop opened from Finder or the Dock has
# no process environment, so the values cannot come from Codex: the loader
# reads the varlock schema plus .env / .env.local (or the secret manager the
# schema names) from the project root whatever launched Codex, and hands the
# server ONLY the variables in its --filter. `--no-redact-stdout` keeps the
# JSON-RPC stream byte-intact (varlock redacts piped output otherwise). No
# `env_vars` beside it: the filter IS the server's dependency list, and
# `bun run agents:compat:check` compares it across the three hosts. Same loader
# on every host: MCP_ENV_LOADER_* in cli/lib/agent-compatibility-contracts.ts
# (ADR-0011). context7 needs no value, so it starts without the loader.
#
# Needs `bun install` once (the varlock devDependency) and a .env in the
# checkout. A Codex-managed worktree gets its .env through .worktreeinclude.
# A value that fails the schema stops the server that needs it:
# `bunx varlock load --agent` shows which, redacted.
#
# `startup_timeout_sec = 30` on each: Codex waits 10 s by default, and a cold
# `bunx` fetch plus the loader hop can pass that before the first handshake.

[mcp_servers.context7]
command = "bunx"
enabled = true
startup_timeout_sec = 30
args = [
  "-y",
  "@upstash/context7-mcp@4.0.3",
]

# The Slack bot MCP (Aurora). Both variables come from .env through the filter
# (the server reads exactly these names); the reaction-channel allowlist is
# workspace identity, so it lives in .env only and an empty value leaves the
# reaction tools off. The one literal setting goes in the env table.
[mcp_servers.slack-aurora]
command = "bunx"
enabled = true
startup_timeout_sec = 30
args = [
  "-p",
  "varlock@1.20.0",
  "varlock",
  "run",
  "--no-redact-stdout",
  "--inject",
  "vars",
  "--filter",
  "SLACK_MCP_XOXP_TOKEN,SLACK_MCP_REACTION_TOOL",
  "--",
  "bunx",
  "-y",
  "slack-mcp-server@latest",
  "--transport",
  "stdio",
]

[mcp_servers.slack-aurora.env]
SLACK_MCP_ADD_MESSAGE_TOOL = "true"

# dbhub.toml interpolates these six from the environment the server is launched
# with, and `shell_environment_policy.inherit = "core"` above forwards nothing
# else. The filter puts all six there; without them dbhub substitutes the
# literal "${DBHUB_HOST}" instead of failing, a connection error that reads like
# bad credentials.
[mcp_servers.dbhub]
command = "bunx"
enabled = true
startup_timeout_sec = 30
args = [
  "-p",
  "varlock@1.20.0",
  "varlock",
  "run",
  "--no-redact-stdout",
  "--inject",
  "vars",
  "--filter",
  "DBHUB_TYPE,DBHUB_HOST,DBHUB_PORT,DBHUB_DATABASE,DBHUB_USER,DBHUB_PASSWORD",
  "--",
  "bunx",
  "-y",
  "@bytebase/dbhub@1.2.1",
  "--config",
  "dbhub.toml",
]

# OPENAPI_SPEC_PATH is the full spec URL or a file path relative to the repo
# root, never the endpoint route alone. No `cwd` key on purpose: Codex passes a
# configured `cwd` to the child process verbatim (no project-root placeholder,
# no resolution against this file), so a relative one resolves against
# wherever Codex was started and an absolute one only works on one machine.
# Without it the server starts in Codex's own directory: start Codex from the
# repo root so a relative OPENAPI_SPEC_PATH resolves there.
[mcp_servers.openapi]
command = "bunx"
enabled = true
startup_timeout_sec = 30
args = [
  "-p",
  "varlock@1.20.0",
  "varlock",
  "run",
  "--no-redact-stdout",
  "--inject",
  "vars",
  "--filter",
  "API_BASE_URL,OPENAPI_SPEC_PATH",
  "--",
  "bunx",
  "-y",
  "@ivotoby/openapi-mcp-server@1.16.1",
  "--tools",
  "dynamic",
]
