# Codex CLI + Desktop read this same file. Instructions come from AGENTS.md and
# skills from .agents/skills/, both natively — neither needs configuring here.
# The MCP inventory below is the Codex-format adapter of the servers that
# .mcp.json and opencode.jsonc also declare; `bun run agents:compat:check`
# compares the three semantically, so a server added to one host only fails.
# Remote servers whose only project-side content was an API key (web search,
# Postman) are not here: connect them at user level (`codex mcp add`, which
# writes ~/.codex/config.toml); skills resolve them by capability.

[shell_environment_policy]
inherit = "core"

# EVERY server below starts through a .env loader: `bunx -p varlock@1.20.0
# varlock run --no-redact-stdout -- <the real command>`. `env_vars` forwards
# variables BY NAME from Codex's own process environment, and Codex Desktop
# opened from Finder or the Dock has none, so without the loader those servers
# started empty (the OpenAPI one exits before the handshake). The loader reads
# the varlock schema plus .env / .env.local from the project root whatever
# launched Codex. `--no-redact-stdout` keeps the JSON-RPC stream byte-intact
# (varlock redacts piped output otherwise). An inherited value wins over .env
# here; `bun run codex` refuses to start while one differs. `env_vars` stays: it
# is what `bun run agents:compat:check` compares across the three hosts.
#
# Needs `bun install` once (the varlock devDependency) and a .env in the
# checkout. A Codex-managed worktree gets its .env through .worktreeinclude.
# A value that fails the schema stops every server: `bunx varlock load --agent`.
#
# `startup_timeout_sec = 30` on each: Codex waits 10 s by default, and a cold
# `bunx` fetch plus the loader hop can pass that before the first handshake.

[mcp_servers.context7]
command = "bunx"
enabled = true
startup_timeout_sec = 30
args = [
  "-p",
  "varlock@1.20.0",
  "varlock",
  "run",
  "--no-redact-stdout",
  "--",
  "bunx",
  "-y",
  "@upstash/context7-mcp@4.0.3",
]

# The Slack bot MCP (Aurora). Both variables are forwarded by name from .env
# (the server reads exactly these names); the reaction-channel allowlist is
# workspace identity, so it lives in .env only and an empty value leaves the
# reaction tools off. The one literal setting goes in the env table.
[mcp_servers.slack-aurora]
command = "bunx"
enabled = true
startup_timeout_sec = 30
args = [
  "-p",
  "varlock@1.20.0",
  "varlock",
  "run",
  "--no-redact-stdout",
  "--",
  "bunx",
  "-y",
  "slack-mcp-server@latest",
  "--transport",
  "stdio",
]
env_vars = [
  "SLACK_MCP_XOXP_TOKEN",
  "SLACK_MCP_REACTION_TOOL",
]

[mcp_servers.slack-aurora.env]
SLACK_MCP_ADD_MESSAGE_TOOL = "true"

[mcp_servers.dbhub]
command = "bunx"
enabled = true
startup_timeout_sec = 30
args = [
  "-p",
  "varlock@1.20.0",
  "varlock",
  "run",
  "--no-redact-stdout",
  "--",
  "bunx",
  "-y",
  "@bytebase/dbhub@1.2.1",
  "--config",
  "dbhub.toml",
]
# dbhub.toml interpolates these six from the environment the server is launched
# with, and `shell_environment_policy.inherit = "core"` above forwards nothing
# else. Without this list Codex starts dbhub with none of them set, and dbhub
# substitutes the literal "${DBHUB_HOST}" instead of failing — a connection
# error that reads like bad credentials. Codex never expands placeholders: the
# values come from the process environment by NAME.
env_vars = [
  "DBHUB_DATABASE",
  "DBHUB_HOST",
  "DBHUB_PASSWORD",
  "DBHUB_PORT",
  "DBHUB_TYPE",
  "DBHUB_USER",
]

[mcp_servers.openapi]
command = "bunx"
enabled = true
startup_timeout_sec = 30
args = [
  "-p",
  "varlock@1.20.0",
  "varlock",
  "run",
  "--no-redact-stdout",
  "--",
  "bunx",
  "-y",
  "@ivotoby/openapi-mcp-server@1.16.1",
  "--tools",
  "dynamic",
]
env_vars = [
  "API_BASE_URL",
  "OPENAPI_SPEC_PATH",
]
