# Codex CLI + Desktop read this same file. Instructions come from AGENTS.md and
# skills from .agents/skills/, both natively — neither needs configuring here.
# The MCP inventory below is the Codex-format adapter of the servers that
# .mcp.json and opencode.jsonc also declare; `bun run agents:compat:check`
# compares the three semantically, so a server added to one host only fails.

[shell_environment_policy]
inherit = "core"

[mcp_servers.context7]
command = "npx"
enabled = true
args = [
  "-y",
  "@upstash/context7-mcp@4.0.3",
]

[mcp_servers.tavily]
url = "https://mcp.tavily.com/mcp/"
bearer_token_env_var = "TAVILY_API_KEY"
enabled = true

[mcp_servers.dbhub]
command = "bunx"
enabled = true
args = [
  "-y",
  "@bytebase/dbhub@1.2.1",
  "--config",
  "dbhub.toml",
]

[mcp_servers.openapi]
command = "bunx"
enabled = true
args = [
  "-y",
  "@ivotoby/openapi-mcp-server@1.16.1",
  "--tools",
  "dynamic",
]
env_vars = [
  "API_BASE_URL",
  "OPENAPI_SPEC_PATH",
]

[mcp_servers.playwright]
command = "bunx"
enabled = true
args = [
  "@playwright/mcp@0.0.79",
  "--caps",
  "vision,pdf,testing,tracing,tabs",
  "--timeout-action",
  "10000",
  "--timeout-navigation",
  "30000",
  "--viewport-size",
  "1920x1080",
]

[mcp_servers.postman]
url = "https://mcp.postman.com/mcp"
bearer_token_env_var = "POSTMAN_API_KEY"
enabled = true
