<svg xmlns="http://www.w3.org/2000/svg" data-testid="JiraTestDiagram" role="img" aria-labelledby="jira-test-title jira-test-desc" viewBox="0 0 1320 800" preserveAspectRatio="xMidYMid meet"><title id="jira-test-title">Ciclo de vida de un caso de prueba en Jira</title><desc id="jira-test-desc">Máquina de estados del ciclo de vida de un caso de prueba en Jira, del borrador a automatizado. Agrupa los diez estados en tres zonas: diseño, automatización y desenlace. Desde READY el caso se bifurca: entra a revisión de automatización o se declara MANUAL. Un caso automatizado vuelve a Pull Request cuando se arregla, y desde cualquier estado puede pasar a DEPRECATED.</desc><defs><marker id="jira-test-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9ba6c8"></polygon></marker><marker id="jira-test-arrow-dim" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="rgba(224,224,224,0.2)"></polygon></marker></defs><rect x="0" y="0" width="1320" height="800" fill="#0a1030"></rect><rect x="40" y="96" width="896" height="152" rx="8" fill="rgba(224,224,224,0.03)" stroke="rgba(224,224,224,0.12)" stroke-width="1"></rect><rect x="352" y="304" width="584" height="280" rx="8" fill="rgba(224,224,224,0.03)" stroke="rgba(224,224,224,0.12)" stroke-width="1"></rect><rect x="976" y="96" width="304" height="488" rx="8" fill="rgba(224,224,224,0.03)" stroke="rgba(224,224,224,0.12)" stroke-width="1"></rect><text x="56" y="120" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.18em">DISEÑO</text><text x="368" y="328" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.18em">AUTOMATIZACIÓN</text><text x="992" y="120" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.18em">DESENLACE</text><circle cx="152" cy="56" r="6" fill="#e0e0e0"></circle><line x1="152" y1="56" x2="152" y2="144" stroke="#9ba6c8" stroke-width="1" marker-end="url(#jira-test-arrow)"></line><line x1="232" y1="176" x2="400" y2="176" stroke="#9ba6c8" stroke-width="1" marker-end="url(#jira-test-arrow)"></line><line x1="560" y1="176" x2="728" y2="176" stroke="#9ba6c8" stroke-width="1" marker-end="url(#jira-test-arrow)"></line><line x1="888" y1="176" x2="1024" y2="176" stroke="#9ba6c8" stroke-width="1" marker-end="url(#jira-test-arrow)"></line><line x1="808" y1="208" x2="808" y2="352" stroke="#9ba6c8" stroke-width="1" marker-end="url(#jira-test-arrow)"></line><line x1="736" y1="384" x2="544" y2="384" stroke="#9ba6c8" stroke-width="1" marker-end="url(#jira-test-arrow)"></line><line x1="472" y1="416" x2="472" y2="480" stroke="#9ba6c8" stroke-width="1" marker-end="url(#jira-test-arrow)"></line><line x1="544" y1="512" x2="736" y2="512" stroke="#9ba6c8" stroke-width="1" marker-end="url(#jira-test-arrow)"></line><path d="M 880 512 H 956 A 8 8 0 0 0 964 504 V 296 A 8 8 0 0 1 972 288 H 1024" fill="none" stroke="#9ba6c8" stroke-width="1" marker-end="url(#jira-test-arrow)"></path><line x1="1128" y1="208" x2="1128" y2="256" stroke="#9ba6c8" stroke-width="1" marker-end="url(#jira-test-arrow)"></line><path d="M 1024 304 H 1004 A 8 8 0 0 0 996 312 V 608 A 8 8 0 0 1 988 616 H 816 A 8 8 0 0 1 808 608 V 544" fill="none" stroke="#9ba6c8" stroke-width="1" marker-end="url(#jira-test-arrow)"></path><line x1="1104" y1="392" x2="1104" y2="464" stroke="rgba(224,224,224,0.2)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#jira-test-arrow-dim)"></line><rect x="160" y="88" width="52" height="12" rx="2" fill="#0a1030"></rect><text x="164" y="96" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.06em">Create</text><rect x="280" y="156" width="72" height="12" rx="2" fill="#0a1030"></rect><text x="316" y="164" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">start design</text><rect x="608" y="156" width="72" height="12" rx="2" fill="#0a1030"></rect><text x="644" y="164" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ready to run</text><rect x="920" y="156" width="72" height="12" rx="2" fill="#0a1030"></rect><text x="956" y="164" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">for manual</text><rect x="816" y="268" width="104" height="12" rx="2" fill="#0a1030"></rect><text x="820" y="276" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.06em">automation review</text><rect x="584" y="364" width="112" height="12" rx="2" fill="#0a1030"></rect><text x="640" y="372" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">approve to automate</text><rect x="480" y="444" width="88" height="12" rx="2" fill="#0a1030"></rect><text x="484" y="452" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.06em">start automation</text><rect x="612" y="492" width="56" height="12" rx="2" fill="#0a1030"></rect><text x="640" y="500" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">create PR</text><rect x="888" y="492" width="56" height="12" rx="2" fill="#0a1030"></rect><text x="892" y="500" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.06em">merged</text><rect x="1136" y="228" width="64" height="12" rx="2" fill="#0a1030"></rect><text x="1140" y="236" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.06em">automated</text><rect x="1004" y="420" width="32" height="12" rx="2" fill="#0a1030"></rect><text x="1020" y="428" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">Fix</text><rect x="1112" y="416" width="72" height="12" rx="2" fill="#0a1030"></rect><text x="1116" y="424" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.06em">Deprecated</text><text x="1104" y="380" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">desde cualquier estado</text><rect x="72" y="144" width="160" height="64" rx="6" fill="#0a1030"></rect><rect x="72" y="144" width="160" height="64" rx="6" fill="rgba(224,224,224,0.05)" stroke="#9ba6c8" stroke-width="1"></rect><text x="152" y="172" fill="#e0e0e0" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Draft</text><text x="152" y="192" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">10029 · new</text><rect x="400" y="144" width="160" height="64" rx="6" fill="#0a1030"></rect><rect x="400" y="144" width="160" height="64" rx="6" fill="rgba(224,224,224,0.05)" stroke="#9ba6c8" stroke-width="1"></rect><text x="480" y="172" fill="#e0e0e0" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">In Design</text><text x="480" y="192" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">10014 · indeterminate</text><rect x="728" y="144" width="160" height="64" rx="6" fill="#0a1030"></rect><rect x="728" y="144" width="160" height="64" rx="6" fill="rgba(0,217,255,0.10)" stroke="#00d9ff" stroke-width="1"></rect><text x="808" y="172" fill="#e0e0e0" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">READY</text><text x="808" y="192" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">10010 · done</text><rect x="736" y="352" width="144" height="64" rx="6" fill="#0a1030"></rect><rect x="736" y="352" width="144" height="64" rx="6" fill="#141b3d" stroke="#e0e0e0" stroke-width="1"></rect><text x="808" y="380" fill="#e0e0e0" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">In Review</text><text x="808" y="400" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">10030 · indeterminate</text><rect x="400" y="352" width="144" height="64" rx="6" fill="#0a1030"></rect><rect x="400" y="352" width="144" height="64" rx="6" fill="#141b3d" stroke="#e0e0e0" stroke-width="1"></rect><text x="472" y="380" fill="#e0e0e0" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Candidate</text><text x="472" y="400" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">10027 · new</text><rect x="400" y="480" width="144" height="64" rx="6" fill="#0a1030"></rect><rect x="400" y="480" width="144" height="64" rx="6" fill="#141b3d" stroke="#e0e0e0" stroke-width="1"></rect><text x="472" y="508" fill="#e0e0e0" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">In Automation</text><text x="472" y="528" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">10031 · indeterminate</text><rect x="736" y="480" width="144" height="64" rx="6" fill="#0a1030"></rect><rect x="736" y="480" width="144" height="64" rx="6" fill="#141b3d" stroke="#e0e0e0" stroke-width="1"></rect><text x="808" y="508" fill="#e0e0e0" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Pull Request</text><text x="808" y="528" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">10032 · indeterminate</text><rect x="1024" y="144" width="208" height="64" rx="6" fill="#0a1030"></rect><rect x="1024" y="144" width="208" height="64" rx="6" fill="rgba(224,224,224,0.05)" stroke="#9ba6c8" stroke-width="1"></rect><text x="1128" y="172" fill="#e0e0e0" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">MANUAL</text><text x="1128" y="192" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">10033 · done</text><rect x="1024" y="256" width="208" height="64" rx="6" fill="#0a1030"></rect><rect x="1024" y="256" width="208" height="64" rx="6" fill="rgba(0,217,255,0.10)" stroke="#00d9ff" stroke-width="1"></rect><text x="1128" y="284" fill="#e0e0e0" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">AUTOMATED</text><text x="1128" y="304" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">10026 · done</text><rect x="1024" y="464" width="208" height="64" rx="6" fill="#0a1030"></rect><rect x="1024" y="464" width="208" height="64" rx="6" fill="rgba(224,224,224,0.02)" stroke="rgba(224,224,224,0.2)" stroke-width="1" stroke-dasharray="4,3"></rect><text x="1128" y="492" fill="#9ba6c8" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">DEPRECATED</text><text x="1128" y="512" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">10034 · done</text><line x1="40" y1="648" x2="1280" y2="648" stroke="rgba(224,224,224,0.12)" stroke-width="0.8"></line><text x="40" y="672" fill="#9ba6c8" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.14em">LEYENDA</text><rect x="40" y="688" width="16" height="12" rx="2" fill="rgba(0,217,255,0.10)" stroke="#00d9ff" stroke-width="1"></rect><text x="64" y="696" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace">Focal: la bifurcación (READY) y el desenlace automatizado (AUTOMATED).</text><line x1="40" y1="712" x2="56" y2="712" stroke="rgba(224,224,224,0.2)" stroke-width="1" stroke-dasharray="4,3"></line><text x="64" y="716" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace">Transición global: se dispara desde cualquier estado, no solo al crear el caso.</text><text x="40" y="736" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace">Bajo cada estado: su id en Jira y su categoría. La categoría NO define el color.</text><text x="40" y="756" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace">El color lo define la posición en el flujo: diseño, automatización, desenlace.</text><text x="680" y="672" fill="#9ba6c8" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.14em">TRANSICIONES OMITIDAS · 12 DE 24</text><text x="680" y="696" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace">Toda etapa vuelve a la anterior con `back` (6 transiciones).</text><text x="680" y="716" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace">MANUAL vuelve a In Review con `automation review` y baja a Candidate con `for automation`.</text><text x="680" y="736" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace">Candidate y AUTOMATED también pasan a MANUAL con `manual execution`.</text><text x="680" y="756" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace">Draft salta directo a In Review con `automation review`, sin pasar por READY.</text><text x="680" y="776" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace">DEPRECATED vuelve a Draft con `recover`: un caso archivado se puede revivir.</text></svg>