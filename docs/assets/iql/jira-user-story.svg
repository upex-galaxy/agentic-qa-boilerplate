<svg xmlns="http://www.w3.org/2000/svg" data-testid="JiraUserStoryDiagram" role="img" aria-labelledby="jira-story-title jira-story-desc" viewBox="0 0 1320 820" preserveAspectRatio="xMidYMid meet"><title id="jira-story-title">Ciclo de vida de una historia de usuario en Jira</title><desc id="jira-story-desc">Máquina de estados del ciclo de vida de una historia de usuario en Jira, del backlog a producción. Recorre cuatro etapas: refinamiento (backlog, análisis Shift-Left QA y estimación), desarrollo (listo para desarrollar, en curso y en revisión de código), QA (listo para probar, en prueba, bloqueado por defecto y aprobado) y cierre (listo para release y desplegado a producción). Un defecto reportado durante la prueba bloquea la historia y la devuelve a desarrollo, y desde cualquier estado la historia puede pasar a ABORTED.</desc><defs><marker id="jira-story-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9ba6c8"></polygon></marker><marker id="jira-story-arrow-dim" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="rgba(224,224,224,0.2)"></polygon></marker></defs><rect x="0" y="0" width="1320" height="820" fill="#0a1030"></rect><rect x="40" y="96" width="272" height="400" rx="8" fill="rgba(224,224,224,0.03)" stroke="rgba(224,224,224,0.12)" stroke-width="1"></rect><rect x="360" y="96" width="272" height="400" rx="8" fill="rgba(224,224,224,0.03)" stroke="rgba(224,224,224,0.12)" stroke-width="1"></rect><rect x="680" y="96" width="272" height="528" rx="8" fill="rgba(224,224,224,0.03)" stroke="rgba(224,224,224,0.12)" stroke-width="1"></rect><rect x="1000" y="368" width="272" height="256" rx="8" fill="rgba(224,224,224,0.03)" stroke="rgba(224,224,224,0.12)" stroke-width="1"></rect><text x="56" y="120" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.18em">1 · REFINAMIENTO</text><text x="376" y="120" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.18em">2 · DESARROLLO</text><text x="696" y="120" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.18em">3 · QA</text><text x="1016" y="392" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.18em">4 · CIERRE</text><circle cx="176" cy="56" r="6" fill="#e0e0e0"></circle><line x1="176" y1="56" x2="176" y2="144" stroke="#9ba6c8" stroke-width="1" marker-end="url(#jira-story-arrow)"></line><line x1="176" y1="208" x2="176" y2="272" stroke="#9ba6c8" stroke-width="1" marker-end="url(#jira-story-arrow)"></line><line x1="176" y1="336" x2="176" y2="400" stroke="#9ba6c8" stroke-width="1" marker-end="url(#jira-story-arrow)"></line><line x1="276" y1="432" x2="396" y2="432" stroke="#9ba6c8" stroke-width="1" marker-end="url(#jira-story-arrow)"></line><line x1="496" y1="400" x2="496" y2="336" stroke="#9ba6c8" stroke-width="1" marker-end="url(#jira-story-arrow)"></line><line x1="496" y1="272" x2="496" y2="208" stroke="#9ba6c8" stroke-width="1" marker-end="url(#jira-story-arrow)"></line><line x1="596" y1="176" x2="716" y2="176" stroke="#9ba6c8" stroke-width="1" marker-end="url(#jira-story-arrow)"></line><line x1="816" y1="208" x2="816" y2="272" stroke="#9ba6c8" stroke-width="1" marker-end="url(#jira-story-arrow)"></line><line x1="816" y1="336" x2="816" y2="400" stroke="#9ba6c8" stroke-width="1" marker-end="url(#jira-story-arrow)"></line><path d="M 716 432 H 664 A 8 8 0 0 1 656 424 V 312 A 8 8 0 0 0 648 304 H 596" fill="none" stroke="#9ba6c8" stroke-width="1" marker-end="url(#jira-story-arrow)"></path><path d="M 916 304 H 960 A 8 8 0 0 1 968 312 V 496 A 8 8 0 0 1 960 504 H 824 A 8 8 0 0 0 816 512 V 528" fill="none" stroke="#9ba6c8" stroke-width="1" marker-end="url(#jira-story-arrow)"></path><line x1="916" y1="560" x2="1036" y2="560" stroke="#9ba6c8" stroke-width="1" marker-end="url(#jira-story-arrow)"></line><line x1="1136" y1="528" x2="1136" y2="464" stroke="#9ba6c8" stroke-width="1" marker-end="url(#jira-story-arrow)"></line><line x1="1136" y1="104" x2="1136" y2="144" stroke="rgba(224,224,224,0.2)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#jira-story-arrow-dim)"></line><rect x="184" y="88" width="52" height="12" rx="2" fill="#0a1030"></rect><text x="188" y="96" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.06em">Create</text><rect x="184" y="216" width="52" height="12" rx="2" fill="#0a1030"></rect><text x="188" y="224" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.06em">Analyze</text><rect x="184" y="344" width="56" height="12" rx="2" fill="#0a1030"></rect><text x="188" y="352" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.06em">Estimate</text><rect x="288" y="412" width="96" height="12" rx="2" fill="#0a1030"></rect><text x="336" y="420" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">Estimated &amp; ready</text><rect x="504" y="356" width="76" height="12" rx="2" fill="#0a1030"></rect><text x="508" y="364" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.06em">Start working</text><rect x="504" y="228" width="72" height="12" rx="2" fill="#0a1030"></rect><text x="508" y="236" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.06em">Pull Request</text><rect x="628" y="156" width="56" height="12" rx="2" fill="#0a1030"></rect><text x="656" y="164" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">Deployed</text><rect x="824" y="216" width="76" height="12" rx="2" fill="#0a1030"></rect><text x="828" y="224" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.06em">Start Testing</text><rect x="824" y="344" width="88" height="12" rx="2" fill="#0a1030"></rect><text x="828" y="352" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.06em">defect reported</text><rect x="664" y="360" width="72" height="12" rx="2" fill="#0a1030"></rect><text x="668" y="368" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.06em">Fix defect</text><rect x="976" y="344" width="72" height="12" rx="2" fill="#0a1030"></rect><text x="980" y="352" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.06em">QA Sign-Off</text><rect x="924" y="540" width="104" height="12" rx="2" fill="#0a1030"></rect><text x="976" y="548" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">include in release</text><rect x="1144" y="484" width="56" height="12" rx="2" fill="#0a1030"></rect><text x="1148" y="492" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.06em">released</text><rect x="1144" y="116" width="64" height="12" rx="2" fill="#0a1030"></rect><text x="1148" y="124" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.06em">ABORTED</text><text x="1136" y="92" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">* desde cualquier estado</text><rect x="76" y="144" width="200" height="64" rx="6" fill="#0a1030"></rect><rect x="76" y="144" width="200" height="64" rx="6" fill="rgba(224,224,224,0.05)" stroke="#9ba6c8" stroke-width="1"></rect><text x="176" y="172" fill="#e0e0e0" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Backlog</text><text x="176" y="192" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">10035 · new</text><rect x="76" y="272" width="200" height="64" rx="6" fill="#0a1030"></rect><rect x="76" y="272" width="200" height="64" rx="6" fill="rgba(224,224,224,0.05)" stroke="#9ba6c8" stroke-width="1"></rect><text x="176" y="300" fill="#e0e0e0" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Shift-Left QA</text><text x="176" y="320" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">10037 · indeterminate</text><rect x="76" y="400" width="200" height="64" rx="6" fill="#0a1030"></rect><rect x="76" y="400" width="200" height="64" rx="6" fill="rgba(224,224,224,0.05)" stroke="#9ba6c8" stroke-width="1"></rect><text x="176" y="428" fill="#e0e0e0" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Estimation</text><text x="176" y="448" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">10019 · indeterminate</text><rect x="396" y="400" width="200" height="64" rx="6" fill="#0a1030"></rect><rect x="396" y="400" width="200" height="64" rx="6" fill="#141b3d" stroke="#e0e0e0" stroke-width="1"></rect><text x="496" y="428" fill="#e0e0e0" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Ready For Dev</text><text x="496" y="448" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">10009 · new</text><rect x="396" y="272" width="200" height="64" rx="6" fill="#0a1030"></rect><rect x="396" y="272" width="200" height="64" rx="6" fill="#141b3d" stroke="#e0e0e0" stroke-width="1"></rect><text x="496" y="300" fill="#e0e0e0" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">In Progress</text><text x="496" y="320" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">3 · indeterminate</text><rect x="396" y="144" width="200" height="64" rx="6" fill="#0a1030"></rect><rect x="396" y="144" width="200" height="64" rx="6" fill="#141b3d" stroke="#e0e0e0" stroke-width="1"></rect><text x="496" y="172" fill="#e0e0e0" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">In Review</text><text x="496" y="192" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">10030 · indeterminate</text><rect x="716" y="144" width="200" height="64" rx="6" fill="#0a1030"></rect><rect x="716" y="144" width="200" height="64" rx="6" fill="#141b3d" stroke="#e0e0e0" stroke-width="1"></rect><text x="816" y="172" fill="#e0e0e0" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Ready For QA</text><text x="816" y="192" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">10004 · new</text><rect x="716" y="272" width="200" height="64" rx="6" fill="#0a1030"></rect><rect x="716" y="272" width="200" height="64" rx="6" fill="#141b3d" stroke="#e0e0e0" stroke-width="1"></rect><text x="816" y="300" fill="#e0e0e0" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">In Test</text><text x="816" y="320" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">10038 · indeterminate</text><rect x="716" y="400" width="200" height="64" rx="6" fill="#0a1030"></rect><rect x="716" y="400" width="200" height="64" rx="6" fill="rgba(0,217,255,0.10)" stroke="#00d9ff" stroke-width="1"></rect><text x="816" y="428" fill="#e0e0e0" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">BLOCKED</text><text x="816" y="448" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">10023 · new</text><rect x="716" y="528" width="200" height="64" rx="6" fill="#0a1030"></rect><rect x="716" y="528" width="200" height="64" rx="6" fill="#141b3d" stroke="#e0e0e0" stroke-width="1"></rect><text x="816" y="556" fill="#e0e0e0" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">QA Approved</text><text x="816" y="576" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">10017 · done</text><rect x="1036" y="528" width="200" height="64" rx="6" fill="#0a1030"></rect><rect x="1036" y="528" width="200" height="64" rx="6" fill="rgba(224,224,224,0.05)" stroke="#9ba6c8" stroke-width="1"></rect><text x="1136" y="556" fill="#e0e0e0" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Ready For Release</text><text x="1136" y="576" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">10039 · done</text><rect x="1036" y="400" width="200" height="64" rx="6" fill="#0a1030"></rect><rect x="1036" y="400" width="200" height="64" rx="6" fill="rgba(0,217,255,0.10)" stroke="#00d9ff" stroke-width="1"></rect><text x="1136" y="428" fill="#e0e0e0" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Deployed to Production</text><text x="1136" y="448" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">10040 · done</text><rect x="1036" y="144" width="200" height="64" rx="6" fill="#0a1030"></rect><rect x="1036" y="144" width="200" height="64" rx="6" fill="rgba(224,224,224,0.02)" stroke="rgba(224,224,224,0.2)" stroke-width="1" stroke-dasharray="4,3"></rect><text x="1136" y="172" fill="#9ba6c8" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">ABORTED</text><text x="1136" y="192" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">10022 · done</text><line x1="40" y1="664" x2="1280" y2="664" stroke="rgba(224,224,224,0.12)" stroke-width="0.8"></line><text x="40" y="688" fill="#9ba6c8" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.14em">LEYENDA</text><rect x="40" y="700" width="16" height="12" rx="2" fill="rgba(0,217,255,0.10)" stroke="#00d9ff" stroke-width="1"></rect><text x="64" y="708" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace">Focal: el desvío que cuesta caro (BLOCKED) y el final del camino (Deployed to Production).</text><line x1="40" y1="724" x2="56" y2="724" stroke="rgba(224,224,224,0.2)" stroke-width="1" stroke-dasharray="4,3"></line><text x="64" y="728" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace">* Transición global: se dispara desde cualquier estado, no solo al crear la historia.</text><text x="40" y="748" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace">Bajo cada estado: su id en Jira y su categoría. La categoría NO define el color.</text><text x="40" y="768" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace">`Estimated &amp; ready` abrevia `Estimated and Ready to work`, su nombre real en Jira.</text><text x="720" y="688" fill="#9ba6c8" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.14em">TRANSICIONES OMITIDAS · 13 DE 27</text><text x="720" y="708" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace">Casi toda etapa vuelve a la anterior con `back` (6 transiciones).</text><text x="720" y="728" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace">`Ready to Estimate`: Backlog salta a Estimation sin pasar por Shift-Left QA.</text><text x="720" y="748" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace">`needs quality`: Estimation vuelve a Shift-Left QA. `Pushed`: In Progress salta a Ready For QA.</text><text x="720" y="768" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace">`back to dev`: BLOCKED vuelve a Ready For Dev. `Recover`: una historia ABORTED vuelve a Ready For Dev.</text><text x="720" y="788" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace">`Ready For Dev` y `Ready For QA` también son globales: se salta ahí desde cualquier estado.</text></svg>