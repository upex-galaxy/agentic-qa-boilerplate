<svg xmlns="http://www.w3.org/2000/svg" data-testid="JiraBugDiagram" role="img" aria-labelledby="jira-bug-title jira-bug-desc" viewBox="0 0 1360 780" preserveAspectRatio="xMidYMid meet"><title id="jira-bug-title">Ciclo de vida de un bug en Jira</title><desc id="jira-bug-desc">Máquina de estados del ciclo de vida de un bug en Jira. Desde Open, el bug se reparte en seis caminos: cuatro lo descartan sin arreglarlo (no reproducible, duplicado, funciona según lo diseñado, es una mejora), uno lo aplaza a Deferred y uno entra al ciclo de arreglo, que va de In Progress a Closed pasando por Pull Request y Ready For QA. Un bug aplazado se retoma hacia In Progress, y desde cualquier estado puede pasar a ABORTED.</desc><defs><marker id="jira-bug-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9ba6c8"></polygon></marker><marker id="jira-bug-arrow-dim" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="rgba(224,224,224,0.2)"></polygon></marker></defs><rect x="0" y="0" width="1360" height="780" fill="#0a1030"></rect><rect x="40" y="72" width="496" height="216" rx="8" fill="rgba(224,224,224,0.03)" stroke="rgba(224,224,224,0.12)" stroke-width="1"></rect><rect x="656" y="72" width="304" height="336" rx="8" fill="rgba(224,224,224,0.03)" stroke="rgba(224,224,224,0.12)" stroke-width="1"></rect><rect x="40" y="440" width="1280" height="176" rx="8" fill="rgba(224,224,224,0.03)" stroke="rgba(224,224,224,0.12)" stroke-width="1"></rect><text x="56" y="96" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.18em">CLASIFICACIÓN</text><text x="672" y="96" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.18em">DESCARTE · NADIE ESCRIBE CÓDIGO</text><text x="56" y="464" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.18em">CICLO DE ARREGLO</text><circle cx="420" cy="48" r="6" fill="#e0e0e0"></circle><line x1="420" y1="48" x2="420" y2="136" stroke="#9ba6c8" stroke-width="1" marker-end="url(#jira-bug-arrow)"></line><line x1="328" y1="168" x2="264" y2="168" stroke="#9ba6c8" stroke-width="1" marker-end="url(#jira-bug-arrow)"></line><path d="M 512 148 H 632 A 8 8 0 0 0 640 140 V 140 A 8 8 0 0 1 648 132 H 696" fill="none" stroke="#9ba6c8" stroke-width="1" marker-end="url(#jira-bug-arrow)"></path><path d="M 512 172 H 600 A 8 8 0 0 1 608 180 V 196 A 8 8 0 0 0 616 204 H 696" fill="none" stroke="#9ba6c8" stroke-width="1" marker-end="url(#jira-bug-arrow)"></path><path d="M 512 196 H 568 A 8 8 0 0 1 576 204 V 268 A 8 8 0 0 0 584 276 H 696" fill="none" stroke="#9ba6c8" stroke-width="1" marker-end="url(#jira-bug-arrow)"></path><path d="M 512 220 H 536 A 8 8 0 0 1 544 228 V 340 A 8 8 0 0 0 552 348 H 696" fill="none" stroke="#9ba6c8" stroke-width="1" marker-end="url(#jira-bug-arrow)"></path><path d="M 376 232 V 416 A 8 8 0 0 1 368 424 H 240 A 8 8 0 0 0 232 432 V 504" fill="none" stroke="#9ba6c8" stroke-width="1" marker-end="url(#jira-bug-arrow)"></path><line x1="176" y1="200" x2="176" y2="504" stroke="#9ba6c8" stroke-width="1" marker-end="url(#jira-bug-arrow)"></line><line x1="288" y1="536" x2="416" y2="536" stroke="#9ba6c8" stroke-width="1" marker-end="url(#jira-bug-arrow)"></line><line x1="616" y1="536" x2="744" y2="536" stroke="#9ba6c8" stroke-width="1" marker-end="url(#jira-bug-arrow)"></line><line x1="944" y1="536" x2="1072" y2="536" stroke="#9ba6c8" stroke-width="1" marker-end="url(#jira-bug-arrow)"></line><line x1="1144" y1="240" x2="1144" y2="280" stroke="rgba(224,224,224,0.2)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#jira-bug-arrow-dim)"></line><rect x="428" y="80" width="52" height="12" rx="2" fill="#0a1030"></rect><text x="432" y="88" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.06em">Create</text><rect x="272" y="148" width="48" height="12" rx="2" fill="#0a1030"></rect><text x="296" y="156" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">defer</text><rect x="644" y="112" width="48" height="12" rx="2" fill="#0a1030"></rect><text x="668" y="120" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">is CNR</text><rect x="616" y="184" width="76" height="12" rx="2" fill="#0a1030"></rect><text x="656" y="192" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">is duplicated</text><rect x="612" y="256" width="48" height="12" rx="2" fill="#0a1030"></rect><text x="636" y="264" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">is WAD</text><rect x="596" y="328" width="80" height="12" rx="2" fill="#0a1030"></rect><text x="636" y="336" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">is not a Bug</text><rect x="384" y="300" width="80" height="12" rx="2" fill="#0a1030"></rect><text x="388" y="308" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.06em">start fixing</text><rect x="184" y="340" width="72" height="12" rx="2" fill="#0a1030"></rect><text x="188" y="348" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.06em">resume fix</text><rect x="316" y="516" width="72" height="12" rx="2" fill="#0a1030"></rect><text x="352" y="524" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">Pull Request</text><rect x="632" y="516" width="96" height="12" rx="2" fill="#0a1030"></rect><text x="680" y="524" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">Fixed &amp; Deployed</text><rect x="968" y="516" width="80" height="12" rx="2" fill="#0a1030"></rect><text x="1008" y="524" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ReTest Passed</text><rect x="1152" y="252" width="64" height="12" rx="2" fill="#0a1030"></rect><text x="1156" y="260" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.06em">ABORTED</text><text x="1144" y="228" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">* desde cualquier estado</text><rect x="328" y="136" width="184" height="96" rx="6" fill="#0a1030"></rect><rect x="328" y="136" width="184" height="96" rx="6" fill="rgba(0,217,255,0.10)" stroke="#00d9ff" stroke-width="1"></rect><text x="420" y="180" fill="#e0e0e0" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Open</text><text x="420" y="200" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">1 · new</text><rect x="88" y="136" width="176" height="64" rx="6" fill="#0a1030"></rect><rect x="88" y="136" width="176" height="64" rx="6" fill="rgba(224,224,224,0.05)" stroke="#9ba6c8" stroke-width="1"></rect><text x="176" y="164" fill="#e0e0e0" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Deferred</text><text x="176" y="184" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">10012 · indeterminate</text><rect x="696" y="104" width="224" height="56" rx="6" fill="#0a1030"></rect><rect x="696" y="104" width="224" height="56" rx="6" fill="rgba(224,224,224,0.05)" stroke="#9ba6c8" stroke-width="1"></rect><text x="808" y="128" fill="#e0e0e0" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Cannot Reproduce</text><text x="808" y="148" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">10041 · done</text><rect x="696" y="176" width="224" height="56" rx="6" fill="#0a1030"></rect><rect x="696" y="176" width="224" height="56" rx="6" fill="rgba(224,224,224,0.05)" stroke="#9ba6c8" stroke-width="1"></rect><text x="808" y="200" fill="#e0e0e0" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Duplicated</text><text x="808" y="220" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">10013 · done</text><rect x="696" y="248" width="224" height="56" rx="6" fill="#0a1030"></rect><rect x="696" y="248" width="224" height="56" rx="6" fill="rgba(224,224,224,0.05)" stroke="#9ba6c8" stroke-width="1"></rect><text x="808" y="272" fill="#e0e0e0" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">REJECTED</text><text x="808" y="292" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">10016 · done</text><rect x="696" y="320" width="224" height="56" rx="6" fill="#0a1030"></rect><rect x="696" y="320" width="224" height="56" rx="6" fill="rgba(224,224,224,0.05)" stroke="#9ba6c8" stroke-width="1"></rect><text x="808" y="344" fill="#e0e0e0" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Enhancement</text><text x="808" y="364" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">10020 · done</text><rect x="1040" y="280" width="208" height="64" rx="6" fill="#0a1030"></rect><rect x="1040" y="280" width="208" height="64" rx="6" fill="rgba(224,224,224,0.02)" stroke="rgba(224,224,224,0.2)" stroke-width="1" stroke-dasharray="4,3"></rect><text x="1144" y="308" fill="#9ba6c8" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">ABORTED</text><text x="1144" y="328" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">10022 · done</text><rect x="88" y="504" width="200" height="64" rx="6" fill="#0a1030"></rect><rect x="88" y="504" width="200" height="64" rx="6" fill="#141b3d" stroke="#e0e0e0" stroke-width="1"></rect><text x="188" y="532" fill="#e0e0e0" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">In Progress</text><text x="188" y="552" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">3 · indeterminate</text><rect x="416" y="504" width="200" height="64" rx="6" fill="#0a1030"></rect><rect x="416" y="504" width="200" height="64" rx="6" fill="#141b3d" stroke="#e0e0e0" stroke-width="1"></rect><text x="516" y="532" fill="#e0e0e0" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">In Review</text><text x="516" y="552" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">10030 · indeterminate</text><rect x="744" y="504" width="200" height="64" rx="6" fill="#0a1030"></rect><rect x="744" y="504" width="200" height="64" rx="6" fill="#141b3d" stroke="#e0e0e0" stroke-width="1"></rect><text x="844" y="532" fill="#e0e0e0" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Ready For QA</text><text x="844" y="552" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">10004 · new</text><rect x="1072" y="504" width="200" height="64" rx="6" fill="#0a1030"></rect><rect x="1072" y="504" width="200" height="64" rx="6" fill="rgba(0,217,255,0.10)" stroke="#00d9ff" stroke-width="1"></rect><text x="1172" y="532" fill="#e0e0e0" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Closed</text><text x="1172" y="552" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">6 · done</text><line x1="40" y1="648" x2="1320" y2="648" stroke="rgba(224,224,224,0.12)" stroke-width="0.8"></line><text x="40" y="672" fill="#9ba6c8" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.14em">LEYENDA</text><rect x="40" y="688" width="16" height="12" rx="2" fill="rgba(0,217,255,0.10)" stroke="#00d9ff" stroke-width="1"></rect><text x="64" y="696" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace">Focal: el repartidor (Open) y el cierre limpio (Closed).</text><line x1="40" y1="712" x2="56" y2="712" stroke="rgba(224,224,224,0.2)" stroke-width="1" stroke-dasharray="4,3"></line><text x="64" y="716" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace">* Transición global: se dispara desde cualquier estado, no solo al crear el bug.</text><text x="40" y="736" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace">Bajo cada estado: su id en Jira y su categoría. La categoría NO define el color.</text><text x="40" y="756" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace">El color lo define la posición en el flujo: triage, descarte, ciclo de arreglo.</text><text x="720" y="672" fill="#9ba6c8" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.14em">TRANSICIONES OMITIDAS · 3 DE 15</text><text x="720" y="696" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace">`Hard pushed`: In Progress salta a Ready For QA sin pasar por In Review.</text><text x="720" y="716" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace">`back`: un bug Closed vuelve a Ready For QA para volver a probarse.</text><text x="720" y="736" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace">`Re-Open`: transición global que devuelve cualquier bug a Open.</text></svg>