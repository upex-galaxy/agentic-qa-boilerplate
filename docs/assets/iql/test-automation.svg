<svg xmlns="http://www.w3.org/2000/svg" data-testid="TestAutomationDiagram" role="img" aria-labelledby="test-automation-title test-automation-desc" viewBox="0 0 1080 804" preserveAspectRatio="xMidYMid meet"><title id="test-automation-title">Los pasos del QA Automation y las capas de KATA</title><desc id="test-automation-desc">Los pasos del Integrated Quality Lifecycle que conduce el QA Automation Engineer, que son las etapas del Test Automation Life Cycle, y debajo la arquitectura KATA sobre la que se implementan: el contexto de pruebas, los componentes base, los componentes de dominio donde vive el decorador de trazabilidad, la capa opcional de pasos reutilizables y los fixtures de inyección. Arriba de la pila, los archivos de test, que consumen los fixtures sin ser una capa. Una capa puede usar las de abajo, nunca al revés.</desc><defs><marker id="ta-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9ba6c8"></polygon></marker></defs><rect x="0" y="0" width="1080" height="804" fill="#0a1030"></rect><text x="24" y="32" fill="#ac68e5" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.14em">IQL · MID-GAME · LOS STEPS DEL QA AUTOMATION ENGINEER</text><line x1="328" y1="80" x2="352" y2="80" stroke="#9ba6c8" stroke-width="1" marker-end="url(#ta-arrow)"></line><line x1="560" y1="80" x2="584" y2="80" stroke="#9ba6c8" stroke-width="1" marker-end="url(#ta-arrow)"></line><line x1="792" y1="80" x2="816" y2="80" stroke="#9ba6c8" stroke-width="1" marker-end="url(#ta-arrow)"></line><path d="M 456 120 V 144 Q 456 152 448 152 H 80 Q 72 152 72 160 V 444 Q 72 452 80 452 H 120" fill="none" stroke="#9ba6c8" stroke-width="1" marker-end="url(#ta-arrow)"></path><rect x="200" y="132" width="128" height="12" rx="2" fill="#0a1030"></rect><text x="264" y="140" fill="#9ba6c8" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.12em" text-anchor="middle">IMPLEMENTA EN CÓDIGO</text><g><rect x="120" y="40" width="208" height="80" rx="6" fill="#0a1030"></rect><rect x="120" y="40" width="208" height="80" rx="6" fill="rgba(157,78,221,0.14)" stroke="#9d4edd" stroke-width="1"></rect><rect x="128" y="48" width="24" height="16" rx="2" fill="transparent" stroke="rgba(172,104,229,0.55)" stroke-width="0.8"></rect><text x="140" y="60" fill="#ac68e5" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">6</text><text x="224" y="84" fill="#e0e0e0" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Evaluación de TCs</text><text x="224" y="100" fill="#e0e0e0" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">para Automatización</text><text x="224" y="112" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.10em" text-anchor="middle">TALC 1ST STAGE</text></g><g><rect x="352" y="40" width="208" height="80" rx="6" fill="#0a1030"></rect><rect x="352" y="40" width="208" height="80" rx="6" fill="rgba(157,78,221,0.14)" stroke="#9d4edd" stroke-width="1"></rect><rect x="360" y="48" width="24" height="16" rx="2" fill="transparent" stroke="rgba(172,104,229,0.55)" stroke-width="0.8"></rect><text x="372" y="60" fill="#ac68e5" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">7</text><text x="456" y="84" fill="#e0e0e0" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Automatización de</text><text x="456" y="100" fill="#e0e0e0" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">los candidatos</text><text x="456" y="112" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.10em" text-anchor="middle">TALC 2ND STAGE</text></g><g><rect x="584" y="40" width="208" height="80" rx="6" fill="#0a1030"></rect><rect x="584" y="40" width="208" height="80" rx="6" fill="rgba(157,78,221,0.14)" stroke="#9d4edd" stroke-width="1"></rect><rect x="592" y="48" width="24" height="16" rx="2" fill="transparent" stroke="rgba(172,104,229,0.55)" stroke-width="0.8"></rect><text x="604" y="60" fill="#ac68e5" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">8</text><text x="688" y="84" fill="#e0e0e0" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Verificación de</text><text x="688" y="100" fill="#e0e0e0" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">la suite en CI</text><text x="688" y="112" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.10em" text-anchor="middle">TALC 3RD STAGE</text></g><g><rect x="816" y="40" width="208" height="80" rx="6" fill="#0a1030"></rect><rect x="816" y="40" width="208" height="80" rx="6" fill="rgba(157,78,221,0.14)" stroke="#9d4edd" stroke-width="1"></rect><rect x="824" y="48" width="24" height="16" rx="2" fill="transparent" stroke="rgba(172,104,229,0.55)" stroke-width="0.8"></rect><text x="836" y="60" fill="#ac68e5" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">9</text><text x="920" y="88" fill="#e0e0e0" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Revisión del Pull Request</text><text x="920" y="112" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.10em" text-anchor="middle">TALC 4TH STAGE</text></g><text x="120" y="184" fill="#9ba6c8" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.14em">KOMPONENT ACTION TEST ARCHITECTURE</text><g><rect x="120" y="200" width="904" height="72" rx="6" fill="rgba(224,224,224,0.02)" stroke="rgba(224,224,224,0.3)" stroke-width="1" stroke-dasharray="4,3"></rect><text x="216" y="232" fill="#9ba6c8" font-size="14" font-weight="600" font-family="'Inter', system-ui, sans-serif">Test files</text><text x="216" y="252" fill="#8792ba" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace">Orquestan ATCs en escenarios. No implementan ninguna capa.</text><text x="1000" y="240" fill="#9ba6c8" font-size="12" font-family="'Inter', system-ui, sans-serif" text-anchor="end">Consume la capa de arriba, sin ser una</text></g><g><rect x="120" y="272" width="904" height="72" rx="6" fill="#0a1030"></rect><rect x="120" y="272" width="904" height="72" rx="6" fill="#141b3d" stroke="rgba(224,224,224,0.12)" stroke-width="1"></rect><rect x="144" y="284" width="48" height="16" rx="2" fill="transparent" stroke="rgba(224,224,224,0.12)" stroke-width="0.8"></rect><text x="168" y="296" fill="#9ba6c8" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">L4</text><text x="216" y="304" fill="#e0e0e0" font-size="14" font-weight="600" font-family="'Inter', system-ui, sans-serif">Fixtures</text><text x="216" y="324" fill="#8792ba" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace">*Fixture.ts</text><text x="1000" y="312" fill="#9ba6c8" font-size="12" font-family="'Inter', system-ui, sans-serif" text-anchor="end">Punto de inyección de dependencias hacia el archivo de test.</text></g><g><rect x="120" y="344" width="904" height="72" rx="6" fill="#0a1030"></rect><rect x="120" y="344" width="904" height="72" rx="6" fill="#141b3d" stroke="rgba(224,224,224,0.12)" stroke-width="1" stroke-dasharray="4,3"></rect><rect x="144" y="356" width="48" height="16" rx="2" fill="transparent" stroke="rgba(224,224,224,0.12)" stroke-width="0.8"></rect><text x="168" y="368" fill="#9ba6c8" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">L3.5</text><text x="216" y="376" fill="#e0e0e0" font-size="14" font-weight="600" font-family="'Inter', system-ui, sans-serif">Steps</text><text x="216" y="396" fill="#8792ba" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace">loginAndSeedCart.step.ts</text><text x="1000" y="384" fill="#9ba6c8" font-size="12" font-family="'Inter', system-ui, sans-serif" text-anchor="end">Cadenas de precondición reutilizables. No llevan @atc.</text></g><g><rect x="120" y="416" width="904" height="72" rx="6" fill="#0a1030"></rect><rect x="120" y="416" width="904" height="72" rx="6" fill="rgba(0,217,255,0.10)" stroke="#00d9ff" stroke-width="1.2"></rect><rect x="144" y="428" width="48" height="16" rx="2" fill="transparent" stroke="#00d9ff" stroke-width="0.8"></rect><text x="168" y="440" fill="#00d9ff" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">L3</text><text x="216" y="448" fill="#e0e0e0" font-size="14" font-weight="600" font-family="'Inter', system-ui, sans-serif">Componentes de dominio</text><text x="216" y="468" fill="#8792ba" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace">UsersApi, LoginPage</text><rect x="392" y="432" width="96" height="16" rx="2" fill="rgba(0,217,255,0.05)" stroke="#00d9ff" stroke-width="0.8"></rect><text x="440" y="444" fill="#00d9ff" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">@atc('KEY')</text><text x="1000" y="456" fill="#00d9ff" font-size="12" font-family="'Inter', system-ui, sans-serif" text-anchor="end">Acá, y solo acá, viven los métodos con el decorador @atc.</text></g><g><rect x="120" y="488" width="904" height="72" rx="6" fill="#0a1030"></rect><rect x="120" y="488" width="904" height="72" rx="6" fill="#141b3d" stroke="rgba(224,224,224,0.12)" stroke-width="1"></rect><rect x="144" y="500" width="48" height="16" rx="2" fill="transparent" stroke="rgba(224,224,224,0.12)" stroke-width="0.8"></rect><text x="168" y="512" fill="#9ba6c8" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">L2</text><text x="216" y="520" fill="#e0e0e0" font-size="14" font-weight="600" font-family="'Inter', system-ui, sans-serif">Base</text><text x="216" y="540" fill="#8792ba" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace">ApiBase.ts · UiBase.ts</text><text x="1000" y="528" fill="#9ba6c8" font-size="12" font-family="'Inter', system-ui, sans-serif" text-anchor="end">Helpers HTTP y helpers de Playwright.</text></g><g><rect x="120" y="560" width="904" height="72" rx="6" fill="#0a1030"></rect><rect x="120" y="560" width="904" height="72" rx="6" fill="#141b3d" stroke="rgba(224,224,224,0.12)" stroke-width="1"></rect><rect x="144" y="572" width="48" height="16" rx="2" fill="transparent" stroke="rgba(224,224,224,0.12)" stroke-width="0.8"></rect><text x="168" y="584" fill="#9ba6c8" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">L1</text><text x="216" y="592" fill="#e0e0e0" font-size="14" font-weight="600" font-family="'Inter', system-ui, sans-serif">TestContext</text><text x="216" y="612" fill="#8792ba" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace">TestContext.ts</text><text x="1000" y="600" fill="#9ba6c8" font-size="12" font-family="'Inter', system-ui, sans-serif" text-anchor="end">Config, logger, faker y entorno. Agnóstico de API y de UI.</text></g><rect x="24" y="656" width="1032" height="68" rx="6" fill="#141b3d" stroke="rgba(224,224,224,0.12)" stroke-width="1" stroke-dasharray="4,4"></rect><text x="48" y="680" fill="#9ba6c8" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.14em">LO QUE ESTE DIBUJO EXISTE PARA FIJAR</text><text x="48" y="704" fill="#8792ba" font-size="12" font-family="'Inter', system-ui, sans-serif">Los archivos de test consumen los Fixtures. Son consumidores, no una capa: contarlos como capa es de dónde salieron los conteos de cinco y de seis.</text><text x="48" y="724" fill="#8792ba" font-size="12" font-family="'Inter', system-ui, sans-serif">El ATC no es un TC implementado en código: es lo que un TC ES cuando nace de un criterio de aceptación, y @atc('KEY') nombra su representación en código, no una entidad distinta.</text><line x1="24" y1="756" x2="1056" y2="756" stroke="rgba(224,224,224,0.12)" stroke-width="0.8"></line><text x="24" y="780" fill="#9ba6c8" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.14em">LEYENDA</text><g><text x="120" y="780" fill="#8792ba" font-size="9" font-family="'Inter', system-ui, sans-serif">Una capa puede usar las de abajo, nunca al revés</text></g><g><line x1="420" y1="776" x2="440" y2="776" stroke="#8792ba" stroke-width="1" stroke-dasharray="4,3"></line><text x="448" y="780" fill="#8792ba" font-size="9" font-family="'Inter', system-ui, sans-serif">Capa opcional</text></g><g><text x="600" y="780" fill="#8792ba" font-size="9" font-family="'Inter', system-ui, sans-serif">TALC · Test Automation Life Cycle</text></g></svg>