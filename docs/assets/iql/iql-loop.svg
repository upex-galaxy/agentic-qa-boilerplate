<svg xmlns="http://www.w3.org/2000/svg" data-testid="IQLLoopDiagram" role="img" aria-labelledby="iql-loop-title iql-loop-desc" viewBox="0 0 1280 500" preserveAspectRatio="xMidYMid meet"><title id="iql-loop-title">El bucle del Integrated Quality Lifecycle, stage por stage</title><desc id="iql-loop-desc">Los ocho stages del método repartidos en cuatro momentos: antes del sprint, dentro del sprint, en el cierre y el release, y en producción. Alrededor, los cuatro eventos del ciclo de desarrollo que producen artefactos sin ser stages. Tres flechas vuelven atrás: el defecto reabre la ejecución, el NO-GO de la regresión devuelve el release a la automatización, y las señales de producción alimentan el análisis del ciclo siguiente.</desc><defs><marker id="iql-loop-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9ba6c8"></polygon></marker><marker id="iql-loop-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#00d9ff"></polygon></marker></defs><rect x="0" y="0" width="1280" height="500" fill="#0a1030"></rect><g><text x="40" y="44" fill="#8792ba" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.14em">ANTES DEL SPRINT</text><line x1="308" y1="28" x2="308" y2="340" stroke="rgba(224,224,224,0.12)" stroke-width="1" stroke-dasharray="3,5"></line></g><g><text x="324" y="44" fill="#8792ba" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.14em">DENTRO DEL SPRINT</text><line x1="668" y1="28" x2="668" y2="340" stroke="rgba(224,224,224,0.12)" stroke-width="1" stroke-dasharray="3,5"></line></g><g><text x="684" y="44" fill="#8792ba" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.14em">CIERRE Y RELEASE</text><line x1="1008" y1="28" x2="1008" y2="340" stroke="rgba(224,224,224,0.12)" stroke-width="1" stroke-dasharray="3,5"></line></g><g><text x="1024" y="44" fill="#8792ba" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.14em">PRODUCCIÓN</text></g><g stroke="#9ba6c8" stroke-width="1.4" fill="none" marker-end="url(#iql-loop-arrow)"><line x1="204" y1="138" x2="336" y2="138"></line><line x1="484" y1="138" x2="506" y2="138"></line><line x1="580" y1="168" x2="580" y2="204"></line><line x1="654" y1="234" x2="696" y2="234"></line><line x1="770" y1="204" x2="770" y2="168"></line><line x1="844" y1="138" x2="856" y2="138"></line><line x1="1004" y1="138" x2="1046" y2="138"></line></g><g stroke="#9ba6c8" stroke-width="1" stroke-dasharray="4,3" fill="none" marker-end="url(#iql-loop-arrow)"><line x1="130" y1="292" x2="130" y2="246"></line><line x1="130" y1="208" x2="130" y2="168"></line><line x1="410" y1="164" x2="410" y2="204"></line><line x1="484" y1="225" x2="536" y2="172"></line><line x1="930" y1="164" x2="930" y2="204"></line></g><path d="M 508 226 C 458 226, 458 150, 504 150" fill="none" stroke="#00d9ff" stroke-width="1.3" marker-end="url(#iql-loop-arrow-accent)"></path><text x="504" y="254" fill="#00d9ff" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="end">defecto → fix → retest</text><path d="M 930 108 C 930 76, 806 76, 772 106" fill="none" stroke="#00d9ff" stroke-width="1.3" marker-end="url(#iql-loop-arrow-accent)"></path><text x="851" y="70" fill="#00d9ff" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">NO-GO</text><path d="M 1120 164 V 400 H 26 V 138 H 54" fill="none" stroke="#5b8def" stroke-width="1.5" marker-end="url(#iql-loop-arrow)"></path><text x="640" y="420" fill="#5b8def" font-size="10" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">change failure rate · escape rate → Shift-Left</text><g><rect x="60" y="292" width="140" height="34" rx="17" fill="rgba(224,224,224,0.02)" stroke="rgba(224,224,224,0.3)" stroke-width="1" stroke-dasharray="4,3"></rect><text x="130" y="313" fill="#9ba6c8" font-size="10" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">MTP</text></g><g><rect x="60" y="208" width="140" height="34" rx="17" fill="rgba(224,224,224,0.02)" stroke="rgba(224,224,224,0.3)" stroke-width="1" stroke-dasharray="4,3"></rect><text x="130" y="229" fill="#9ba6c8" font-size="10" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">STP</text></g><g><rect x="340" y="208" width="140" height="34" rx="17" fill="rgba(224,224,224,0.02)" stroke="rgba(224,224,224,0.3)" stroke-width="1" stroke-dasharray="4,3"></rect><text x="410" y="223" fill="#9ba6c8" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">Desarrollo e</text><text x="410" y="235" fill="#9ba6c8" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">implementación</text></g><g><rect x="860" y="208" width="140" height="34" rx="17" fill="rgba(224,224,224,0.02)" stroke="rgba(224,224,224,0.3)" stroke-width="1" stroke-dasharray="4,3"></rect><text x="930" y="229" fill="#9ba6c8" font-size="10" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">STR</text></g><g><rect x="60" y="112" width="140" height="52" rx="6" fill="#0a1030"></rect><rect x="60" y="112" width="140" height="52" rx="6" fill="rgba(0,217,255,0.1)" stroke="#00d9ff" stroke-width="1.2"></rect><text x="130" y="136" fill="#e0e0e0" font-size="13" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Shift-Left</text><text x="130" y="153" fill="#00d9ff" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.1em" text-anchor="middle">L1<!-- --> · shift-left-testing</text></g><g><rect x="340" y="112" width="140" height="52" rx="6" fill="#0a1030"></rect><rect x="340" y="112" width="140" height="52" rx="6" fill="rgba(0,217,255,0.1)" stroke="#00d9ff" stroke-width="1.2"></rect><text x="410" y="136" fill="#e0e0e0" font-size="13" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Planning</text><text x="410" y="153" fill="#00d9ff" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.1em" text-anchor="middle">L1<!-- --> · sprint-testing</text></g><g><rect x="510" y="112" width="140" height="52" rx="6" fill="#0a1030"></rect><rect x="510" y="112" width="140" height="52" rx="6" fill="rgba(0,217,255,0.1)" stroke="#00d9ff" stroke-width="1.2"></rect><text x="580" y="136" fill="#e0e0e0" font-size="13" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Execution</text><text x="580" y="153" fill="#00d9ff" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.1em" text-anchor="middle">L2<!-- --> · sprint-testing</text></g><g><rect x="510" y="208" width="140" height="52" rx="6" fill="#0a1030"></rect><rect x="510" y="208" width="140" height="52" rx="6" fill="rgba(0,217,255,0.1)" stroke="#00d9ff" stroke-width="1.2"></rect><text x="580" y="232" fill="#e0e0e0" font-size="13" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Reporting</text><text x="580" y="249" fill="#00d9ff" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.1em" text-anchor="middle">L2<!-- --> · sprint-testing</text></g><g><rect x="700" y="208" width="140" height="52" rx="6" fill="#0a1030"></rect><rect x="700" y="208" width="140" height="52" rx="6" fill="rgba(0,217,255,0.1)" stroke="#00d9ff" stroke-width="1.2"></rect><text x="770" y="232" fill="#e0e0e0" font-size="13" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Documentation</text><text x="770" y="249" fill="#00d9ff" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.1em" text-anchor="middle">L3<!-- --> · test-documentation</text></g><g><rect x="700" y="112" width="140" height="52" rx="6" fill="#0a1030"></rect><rect x="700" y="112" width="140" height="52" rx="6" fill="rgba(157,78,221,0.14)" stroke="#9d4edd" stroke-width="1.2"></rect><text x="770" y="136" fill="#e0e0e0" font-size="13" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Automation</text><text x="770" y="153" fill="#ac68e5" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.1em" text-anchor="middle">L3<!-- --> · test-automation</text></g><g><rect x="860" y="112" width="140" height="52" rx="6" fill="#0a1030"></rect><rect x="860" y="112" width="140" height="52" rx="6" fill="rgba(255,107,157,0.1)" stroke="#ff6b9d" stroke-width="1.2"></rect><text x="930" y="136" fill="#e0e0e0" font-size="13" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Regression</text><text x="930" y="153" fill="#ff6b9d" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.1em" text-anchor="middle">L3<!-- --> · regression-testing</text></g><g><rect x="1050" y="112" width="140" height="52" rx="6" fill="#0a1030"></rect><rect x="1050" y="112" width="140" height="52" rx="6" fill="rgba(255,107,157,0.1)" stroke="#ff6b9d" stroke-width="1.2"></rect><text x="1120" y="136" fill="#e0e0e0" font-size="13" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Observation</text><text x="1120" y="153" fill="#ff6b9d" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.1em" text-anchor="middle">L4</text></g><line x1="24" y1="452" x2="1256" y2="452" stroke="rgba(224,224,224,0.12)" stroke-width="0.8"></line><text x="24" y="476" fill="#9ba6c8" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.14em">LEYENDA</text><g><rect x="110" y="466" width="24" height="13" rx="2" fill="rgba(0,217,255,0.1)" stroke="#00d9ff" stroke-width="1"></rect><text x="144" y="476" fill="#8792ba" font-size="9" font-family="'Inter', system-ui, sans-serif">stage del IQL (skill dueña + gate)</text><rect x="392" y="466" width="24" height="13" rx="6.5" fill="none" stroke="rgba(224,224,224,0.3)" stroke-width="1" stroke-dasharray="4,3"></rect><text x="426" y="476" fill="#8792ba" font-size="9" font-family="'Inter', system-ui, sans-serif">evento del SDLC (no es actividad de QA)</text><line x1="700" y1="472" x2="728" y2="472" stroke="#00d9ff" stroke-width="1.3"></line><text x="738" y="476" fill="#8792ba" font-size="9" font-family="'Inter', system-ui, sans-serif">vuelta dentro del ciclo</text><line x1="900" y1="472" x2="928" y2="472" stroke="#5b8def" stroke-width="1.5"></line><text x="938" y="476" fill="#8792ba" font-size="9" font-family="'Inter', system-ui, sans-serif">producción alimenta el siguiente ciclo</text></g></svg>