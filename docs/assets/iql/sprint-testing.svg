iddle">Completar el ATR</text><text x="284" y="548" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.10em" text-anchor="middle">RESULTADO POR CASO</text></g><g><rect x="392" y="472" width="168" height="88" rx="6" fill="#0a1030"></rect><rect x="392" y="472" width="168" height="88" rx="6" fill="#141b3d" stroke="#e0e0e0" stroke-width="1"></rect><rect x="400" y="480" width="24" height="16" rx="2" fill="transparent" stroke="#9ba6c8" stroke-width="0.8"></rect><text x="412" y="492" fill="#9ba6c8" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">9</text><text x="476" y="516" fill="#e0e0e0" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Comentario de QA y</text><text x="476" y="532" fill="#e0e0e0" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">transición del ticket</text><text x="476" y="548" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.10em" text-anchor="middle">DEFECTOS, SI LOS HUBO</text></g><line x1="24" y1="616" x2="1176" y2="616" stroke="rgba(224,224,224,0.12)" stroke-width="0.8"></line><text x="24" y="636" fill="#9ba6c8" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.14em">LEYENDA</text><g><line x1="120" y1="632" x2="140" y2="632" stroke="#8792ba" stroke-width="1" stroke-dasharray="4,3"></line><text x="148" y="636" fill="#8792ba" font-size="9" font-family="'Inter', system-ui, sans-serif">La lista deriva del ATS, no se re-lista</text></g><g><line x1="532" y1="632" x2="552" y2="632" stroke="#00d9ff" stroke-width="1"></line><text x="560" y="636" fill="#8792ba" font-size="9" font-family="'Inter', system-ui, sans-serif">Única arista que da cobertura</text></g><g><text x="900" y="636" fill="#8792ba" font-size="9" font-family="'Inter', system-ui, sans-serif">DoD · Definition of Done</text></g></svg>