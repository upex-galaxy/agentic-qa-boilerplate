"168" height="88" rx="6" fill="#0a1030"></rect><rect x="392" y="72" width="168" height="88" rx="6" fill="#141b3d" stroke="#e0e0e0" stroke-width="1"></rect><rect x="400" y="80" width="24" height="16" rx="2" fill="transparent" stroke="#9ba6c8" stroke-width="0.8"></rect><text x="412" y="92" fill="#9ba6c8" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">2</text><text x="476" y="116" fill="#e0e0e0" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Crear el ATS con</text><text x="476" y="132" fill="#e0e0e0" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">todos ellos</text><text x="476" y="148" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.10em" text-anchor="middle">ATS: {STORY-KEY}: {TITLE}</text></g><g><rect x="584" y="72" width="168" height="88" rx="6" fill="#0a1030"></rect><rect x="584" y="72" width="168" height="88" rx="6" fill="rgba(0,217,255,0.10)" stroke="#00d9ff" stroke-width="1.2"></rect><rect x="592" y="80" width="24" height="16" rx="2" fill="transparent" stroke="#00d9ff" stroke-width="0.8"></rect><text x="604" y="92" fill="#00d9ff" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">3</text><text x="668" y="116" fill="#e0e0e0" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Linkear ATS a la</text><text x="668" y="132" fill="#e0e0e0" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">historia</text><text x="668" y="148" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.10em" text-anchor="middle">SLUG TEST · IS TESTED BY</text></g><g><rect x="776" y="72" width="168" height="88" rx="6" fill="#0a1030"></rect><rect x="776" y="72" width="168" height="88" rx="6" fill="#141b3d" stroke="#e0e0e0" stroke-width="1"></rect><rect x="784" y="80" width="24" height="16" rx="2" fill="transparent" stroke="#9ba6c8" stroke-width="0.8"></rect><text x="796" y="92" fill="#9ba6c8" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">4</text><text x="860" y="120" fill="#e0e0e0" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Recién ahí, el ATP</text><text x="860" y="148" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.10em" text-anchor="middle">DESDE EL CUSTOM FIELD</text></g><g><rect x="968" y="72" width="168" height="88" rx="6" fill="#0a1030"></rect><rect x="968" y="72" width="168" height="88" rx="6" fill="#141b3d" stroke="#e0e0e0" stroke-width="1"></rect><rect x="976" y="80" width="24" height="16" rx="2" fill="transparent" stroke="#9ba6c8" stroke-width="0.8"></rect><text x="988" y="92" fill="#9ba6c8" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">5</text><text x="1052" y="112" fill="#e0e0e0" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">El ATR, con su Test</text><text x="1052" y="128" fill="#e0e0e0" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Environment</text><rect x="984" y="140" width="136" height="14" rx="2" fill="rgba(0,217,255,0.05)" stroke="#00d9ff" stroke-width="0.8" stroke-dasharray="4,4"></rect><text x="1052" y="150" fill="#00d9ff" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.06em" text-anchor="middle">SIN ENV NO PASA EL DoD</text></g><g><rect x="200" y="288" width="168" height="88" rx="6" fill="#0a1030"></rect><rect x="200" y="288" width="168" height="88" rx="6" fill="#141b3d" stroke="#e0e0e0" stroke-width="1"></rect><rect x="208" y="296" width="24" height="16" rx="2" fill="transparent" stroke="#9ba6c8" stroke-width="