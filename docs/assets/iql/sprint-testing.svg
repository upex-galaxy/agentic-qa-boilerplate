<svg xmlns="http://www.w3.org/2000/svg" data-testid="SprintTestingDiagram" role="img" aria-labelledby="sprint-testing-title sprint-testing-desc" viewBox="0 0 1200 656" preserveAspectRatio="xMidYMid meet"><title id="sprint-testing-title">Los pasos del QA Analyst en el sprint</title><desc id="sprint-testing-desc">Los tres stages del flujo de sprint testing. La planificación crea primero los casos de prueba, después el Acceptance Test Set que los agrupa, después el enlace del set a la historia —el único que da cobertura—, después el plan de aceptación desde el campo de la historia y por último la corrida, que sin Test Environment no pasa el Definition of Done. Las listas del plan y de la corrida derivan de la membresía del set. Siguen la ejecución, que empieza por el smoke y sigue con la exploración, y el reporte.</desc><defs><marker id="sprint-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9ba6c8"></polygon></marker><marker id="sprint-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#00d9ff"></polygon></marker><marker id="sprint-arrow-sm" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><polygon points="0 0, 6 2.5, 0 5" fill="#8792ba"></polygon></marker></defs><rect x="0" y="0" width="1200" height="656" fill="#0a1030"></rect><g><rect x="24" y="40" width="1136" height="184" rx="8" fill="#141b3d" stroke="rgba(224,224,224,0.12)" stroke-width="1"></rect><line x1="176" y1="56" x2="176" y2="208" stroke="rgba(224,224,224,0.12)" stroke-width="1"></line><text x="40" y="84" fill="#9ba6c8" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.14em">01</text><text x="40" y="108" fill="#e0e0e0" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif">Planning</text><text x="40" y="128" fill="#8792ba" font-size="9" font-family="'Inter', system-ui, sans-serif">El orden importa</text><text x="40" y="152" fill="#9ba6c8" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.12em">MODALIDAD JIRA-XRAY</text></g><g><rect x="24" y="256" width="1136" height="152" rx="8" fill="#141b3d" stroke="rgba(224,224,224,0.12)" stroke-width="1"></rect><line x1="176" y1="272" x2="176" y2="392" stroke="rgba(224,224,224,0.12)" stroke-width="1"></line><text x="40" y="300" fill="#9ba6c8" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.14em">02</text><text x="40" y="324" fill="#e0e0e0" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif">Execution</text><text x="40" y="344" fill="#8792ba" font-size="9" font-family="'Inter', system-ui, sans-serif">Smoke, luego explorar</text></g><g><rect x="24" y="440" width="1136" height="152" rx="8" fill="#141b3d" stroke="rgba(224,224,224,0.12)" stroke-width="1"></rect><line x1="176" y1="456" x2="176" y2="576" stroke="rgba(224,224,224,0.12)" stroke-width="1"></line><text x="40" y="484" fill="#9ba6c8" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.14em">03</text><text x="40" y="508" fill="#e0e0e0" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif">Reporting</text><text x="40" y="528" fill="#8792ba" font-size="9" font-family="'Inter', system-ui, sans-serif">Cerrar y comunicar</text></g><line x1="368" y1="116" x2="392" y2="116" stroke="#9ba6c8" stroke-width="1" marker-end="url(#sprint-arrow)"></line><line x1="560" y1="116" x2="584" y2="116" stroke="#9ba6c8" stroke-width="1" marker-end="url(#sprint-arrow)"></line><line x1="752" y1="116" x2="776" y2="116" stroke="#9ba6c8" stroke-width="1" marker-end="url(#sprint-arrow)"></line><line x1="944" y1="116" x2="968" y2="116" stroke="#9ba6c8" stroke-width="1" marker-end="url(#sprint-arrow)"></line><line x1="368" y1="332" x2="392" y2="332" stroke="#9ba6c8" stroke-width="1" marker-end="url(#sprint-arrow)"></line><line x1="368" y1="516