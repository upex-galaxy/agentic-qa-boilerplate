/text><rect x="640" y="76" width="112" height="40" rx="6" fill="#0a1030"></rect><rect x="640" y="76" width="112" height="40" rx="6" fill="#141b3d" stroke="#e0e0e0" stroke-width="1"></rect><text x="696" y="96" fill="#e0e0e0" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Story</text><text x="696" y="108" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">is tested by</text><rect x="792" y="72" width="240" height="48" rx="4" fill="rgba(0,217,255,0.10)" stroke="#00d9ff" stroke-width="1.2"></rect><text x="808" y="92" fill="#00d9ff" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.14em">COBERTURA</text><text x="808" y="112" fill="#00d9ff" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif">Llena el panel</text></g><g><line x1="224" y1="192" x2="344" y2="192" stroke="#8792ba" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#tm-arrow-sm)"></line><line x1="480" y1="192" x2="640" y2="192" stroke="#9ba6c8" stroke-width="1" marker-end="url(#tm-arrow)"></line><rect x="236" y="172" width="96" height="12" rx="2" fill="#141b3d"></rect><text x="284" y="180" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.08em" text-anchor="middle">MEMBRESÍA XRAY</text><rect x="500" y="172" width="120" height="12" rx="2" fill="#141b3d"></rect><text x="560" y="180" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.08em" text-anchor="middle">ISSUE LINK · TESTS</text><rect x="48" y="168" width="40" height="16" rx="2" fill="transparent" stroke="rgba(224,224,224,0.12)" stroke-width="0.8"></rect><text x="68" y="180" fill="#9ba6c8" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">2</text><rect x="136" y="172" width="88" height="40" rx="6" fill="#0a1030"></rect><rect x="136" y="172" width="88" height="40" rx="6" fill="rgba(224,224,224,0.05)" stroke="#9ba6c8" stroke-width="1"></rect><text x="180" y="192" fill="#e0e0e0" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">TC</text><text x="180" y="204" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">Test Case</text><rect x="344" y="172" width="136" height="40" rx="6" fill="#0a1030"></rect><rect x="344" y="172" width="136" height="40" rx="6" fill="#141b3d" stroke="#e0e0e0" stroke-width="1"></rect><text x="412" y="192" fill="#e0e0e0" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">ATP</text><text x="412" y="204" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">Acceptance Test Plan</text><rect x="640" y="172" width="112" height="40" rx="6" fill="#0a1030"></rect><rect x="640" y="172" width="112" height="40" rx="6" fill="#141b3d" stroke="#e0e0e0" stroke-width="1"></rect><text x="696" y="192" fill="#e0e0e0" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Story</text><text x="696" y="204" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">is tested by</text><rect x="792" y="168" width="240" height="48" rx="4" fill="transparent" stroke="rgba(224,224,224,0.12)" stroke-width="0.8"></rect><text x="808" y="188" fill="#9ba6c8" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.14em">TRAZABILIDAD ADMINISTRATIVA</text><text x="808" y="208" fill="#e0e0e0" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif">UNCOVERED · 0 tests</text></g><g><line x1="224" y1="288" x2="640" y2="288" stroke="#9ba6c8" stroke-width="1" marker-end="url(#tm-arrow)"></line><rect x="368" y="268" width="128" height="12" rx="2" fill="#141b3d"></rect><text x="432" y="276" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.08em" text-anchor="middle">ISSUE LINK DIRECTO</text><rect x="48" y="264" width="40" height="16" rx="2" fill="transparent" stroke="rgba(224,224,224,0.12)" stroke-width="0.8"></rect><text x="68" y="276" fill="#9ba6c8" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">3</text><rect x="136" y="268" width="88" height="40" rx="6" fill="#0a1030"></rect><rect x="136" y="268" width="88" height="40" rx="6" fill="rgba(224,224,224,0.05)" stroke="#9ba6c8" stroke-width="1"></rect><text x="180" y="288" fill="#e0e0e0" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">TC</text><text x="180" y="300" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">Test Case</text><rect x="640" y="268" width="112" height="40" rx="6" fill="#0a1030"></rect><rect x="640" y="268" width="112" height="40" rx="6" fill="#141b3d" stroke="#e0e0e0" stroke-width="1"></rect><text x="696" y="288" fill="#e0e0e0" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Story</text><text x="696" y="300" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">is tested by</text><rect x="792" y="264" width="240" height="48" rx="4" fill="transparent" stroke="rgba(224,224,224,0.12)" stroke-width="0.8"></rect><text x="808" y="284" fill="#9ba6c8" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.14em">COBERTURA</text><text x="808" y="304" fill="#e0e0e0" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif">Último recurso válido</text></g><g><line x1="224" y1="384" x2="640" y2="384" stroke="#8792ba" stroke-width="1" stroke-dasharray="4,3"></line><rect x="368" y="364" width="128" height="12" rx="2" fill="#141b3d"></rect><text x="432" y="372" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.08em" text-anchor="middle">SIN ARISTA</text><path d="M 424 376 L 440 392 M 440 376 L 424 392" stroke="#8792ba" stroke-width="1.2" fill="none"></path><rect x="48" y="360" width="40" height="16" rx="2" fill="transparent" stroke="rgba(224,224,224,0.12)" stroke-width="0.8"></rect><text x="68" y="372" fill="#9ba6c8" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">—</text><rect x="136" y="364" width="88" height="40" rx="6" fill="#0a1030"></rect><rect x="136" y="364" width="88" height="40" rx="6" fill="rgba(224,224,224,0.05)" stroke="#9ba6c8" stroke-width="1"></rect><text x="180" y="384" fill="#e0e0e0" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">TC</text><text x="180" y="396" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">Test Case</text><rect x="640" y="364" width="112" height="40" rx="6" fill="#0a1030"></rect><rect x="640" y="364" width="112" height="40" rx="6" fill="rgba(224,224,224,0.02)" stroke="rgba(224,224,224,0.2)" stroke-width="1" stroke-dasharray="4,3"></rect><text x="696" y="384" fill="#8792ba" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Story</text><text x="696" y="396" fill="#8792ba" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">sin cubrir</text><rect x="792" y="360" width="240" height="48" rx="4" fill="transparent" stroke="rgba(224,224,224,0.12)" stroke-width="0.8"></rect><text x="808" y="380" fill="#9ba6c8" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.14em">HUÉRFANO</text><text x="808" y="400" fill="#e0e0e0" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif">Fuera de trazabilidad</text></g><rect x="24" y="456" width="1032" height="72" rx="6" fill="#141b3d" stroke="rgba(224,224,224,0.12)" stroke-width="1" stroke-dasharray="4,4"></rect><text x="48" y="480" fill="#9ba6c8" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.14em">MODALIDAD JIRA-NATIVE</text><text x="48" y="500" fill="#8792ba" font-size="12" font-family="'Inter', system-ui, sans-serif">Sin capa de Xray no hay membresía por GraphQL: ahí la pertenencia sí se expresa como issue links TC a ATS.</text><text x="48" y="516" fill="#8792ba" font-size="12" font-family="'Inter', system-ui, sans-serif">Y si la instancia no tiene el work type Test Set, no hay ATS: la cascada cae directo al tercer peldaño.</text><line x1="24" y1="560" x2="1056" y2="560" stroke="rgba(224,224,224,0.12)" stroke-width="0.8"></line><text x="24" y="584" fill="#9ba6c8" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.14em">LEYENDA</text><g><line x1="120" y1="580" x2="140" y2="580" stroke="#8792ba" stroke-width="1" stroke-dasharray="4,3"></line><text x="148" y="584" fill="#8792ba" font-size="9" font-family="'Inter', system-ui, sans-serif">Membresía de Xray (GraphQL), no es un issue link</text></g><g><line x1="408" y1="580" x2="428" y2="580" stroke="#9ba6c8" stroke-width="1"></line><text x="436" y="584" fill="#8792ba" font-size="9" font-family="'Inter', system-ui, sans-serif">Issue link de Jira, slug test</text></g><g><line x1="616" y1="580" x2="636" y2="580" stroke="#00d9ff" stroke-width="1"></line><text x="644" y="584" fill="#8792ba" font-size="9" font-family="'Inter', system-ui, sans-serif">La historia es la parte inward: invertir la arista da cero cobertura</text></g></svg>