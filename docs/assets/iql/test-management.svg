<svg xmlns="http://www.w3.org/2000/svg" data-testid="TestManagementDiagram" role="img" aria-labelledby="test-management-title test-management-desc" viewBox="0 0 1080 608" preserveAspectRatio="xMidYMid meet"><title id="test-management-title">La cascada de cobertura de un Test Case</title><desc id="test-management-desc">Los tres peldaños por los que un caso de prueba resuelve hasta su historia de usuario. El primero pasa por el Acceptance Test Set y es el único que llena el panel de cobertura. El segundo pasa por el Acceptance Test Plan y la historia se lee sin cobertura aunque el enlace exista. El tercero enlaza el caso directo a la historia y es un último recurso válido. Un caso sin ninguna de esas aristas queda huérfano. También distingue las dos capas en juego: la membresía interna de Xray y los enlaces de asunto de Jira.</desc><defs><marker id="tm-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9ba6c8"></polygon></marker><marker id="tm-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#00d9ff"></polygon></marker><marker id="tm-arrow-sm" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><polygon points="0 0, 6 2.5, 0 5" fill="#8792ba"></polygon></marker></defs><rect x="0" y="0" width="1080" height="608" fill="#0a1030"></rect><text x="24" y="32" fill="#9ba6c8" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.14em">CASCADA DE RESOLUCIÓN · SE BAJA UN PELDAÑO SOLO CUANDO EL ANTERIOR NO EXISTE</text><rect x="24" y="48" width="1032" height="384" rx="8" fill="#141b3d" stroke="rgba(224,224,224,0.24)" stroke-width="1"></rect><line x1="24" y1="144" x2="1056" y2="144" stroke="rgba(224,224,224,0.12)" stroke-width="0.8"></line><line x1="24" y1="240" x2="1056" y2="240" stroke="rgba(224,224,224,0.12)" stroke-width="0.8"></line><line x1="24" y1="336" x2="1056" y2="336" stroke="rgba(224,224,224,0.1