# ============================================
# EDD - Evidence verifier (edd/evidence)
# ============================================
# Purpose: post the `edd/evidence` check that the evidence contract
# (`evidence:` in .agents/project.yaml) makes a merge depend on.
#
# SECURITY (spec R11). `pull_request_target` runs this file and every
# checkout without a `ref` from the DEFAULT branch, with a token that can
# write. So no step here may run code from the pull request: the PR head is
# fetched as git objects only and read as data by the default branch's own
# `scripts/edd.ts verify --ci`, which reads the contract and
# .agents/edd/allowed_signers from the PR's base commit. Never add a
# `ref:` to the checkout, a `bun install` with scripts, a `bun run` of a
# package.json key, or a `${{ }}` of a PR-controlled string inside `run:`.
#
# The push side (detection after a direct push, spec 5.2) lives in
# evidence-push.yml: a job skipped by `if:` still posts its check as skipped,
# which a required check reads as success, so no push run may carry a job
# named `edd/evidence`. Making `edd/evidence` a required check is a host write
# the owner authorizes separately (`bun run git:policy apply`).
#
# WHAT THE CHECK PROVES. A required check pinned to the GitHub Actions app
# cannot tell this job from any other Actions run: a branch can add its own
# workflow with a job named `edd/evidence` and post a green check. So this
# check catches mistakes and drift; it does not stop an agent that
# deliberately forges a check (accepted residual risk, spec-corrections item
# 19; the upgrade path is a dedicated GitHub App as the check source).

name: EDD Evidence
run-name: ${{ github.actor }} triggered EDD Evidence on ${{ github.ref_name }}

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review, assigned, unassigned]

permissions: {}

concurrency:
  group: edd-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  Evidence:
    name: edd/evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout the trusted code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch the pull request as data
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/${PR_NUMBER}/head"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Verify the evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/edd.ts verify --ci

      - name: Upload the record
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: edd-evidence-${{ github.run_id }}
          path: .session/evidence/*.json
          include-hidden-files: true
          if-no-files-found: ignore
