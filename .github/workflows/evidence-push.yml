# ============================================
# EDD - Evidence detection after a direct push (edd/evidence (push))
# ============================================
# Purpose: after a direct push to a protected branch whose base contract sets
# direct_push_to_protected: evidence, re-check the pushed range with
# `scripts/edd.ts verify --ci` and keep the record (spec 5.2). It detects
# after the fact and runs the pushed code; the merge gate is evidence.yml.
# Its job is never named `edd/evidence`: that name belongs to the
# pull_request_target verifier alone. Like that check, this one catches
# mistakes and drift, not a deliberate forgery (spec-corrections item 19).

name: EDD Evidence (push)
run-name: ${{ github.actor }} triggered EDD Evidence (push) on ${{ github.ref_name }}

on:
  push:
    branches:
      - '**'

permissions: {}

concurrency:
  group: edd-evidence-push-${{ github.sha }}
  cancel-in-progress: false

jobs:
  PushEvidence:
    name: edd/evidence (push)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install Dependencies
        run: bun install --frozen-lockfile --ignore-scripts --production

      - name: Verify the evidence
        run: bun scripts/edd.ts verify --ci

      - name: Upload the record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: edd-evidence-${{ github.run_id }}
          path: .session/evidence/*.json
          include-hidden-files: true
          if-no-files-found: ignore
