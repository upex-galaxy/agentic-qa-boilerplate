# ============================================
# KATA Architecture - Regression Test Pipeline
# ============================================
# Purpose: Complete test coverage - Integration tests first, then E2E tests.
# This is the main test pipeline for full regression testing.

name: Regression Tests
run-name: ${{ github.actor }} triggered Regression Tests on ${{ github.event.inputs.environment || 'staging' }}

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC

  workflow_dispatch:
    inputs:
      environment:
        description: Select the Test Environment
        required: true
        default: 'staging'
        type: choice
        options:
          - local
          - staging
      video_record:
        description: Enable Video Recording
        required: true
        default: false
        type: boolean
      generate_allure:
        description: Generate Allure Report
        required: true
        default: true
        type: boolean
      execution_key:
        description: 'Key of the Test Execution this run imports into: the RTR created by /regression-testing for this run (or the sprint-close STR). Overrides the STP_EXECUTION_KEY secret.'
        required: false
        default: ''
        type: string

concurrency:
  # Suite runs publish Allure to gh-pages. Two overlapping runs race on that
  # deploy and one silently overwrites the other's report. Queue instead of
  # cancelling: a half-finished suite that still uploaded results would leave
  # a partial report standing as if it were the full one.
  group: regression-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true
  TEST_ENV: ${{ github.event.inputs.environment || 'staging' }}
  VIDEO: ${{ github.event.inputs.video_record || false }}
  # Credentials (required for test execution)
  LOCAL_USER_EMAIL: ${{ secrets.LOCAL_USER_EMAIL }}
  LOCAL_USER_PASSWORD: ${{ secrets.LOCAL_USER_PASSWORD }}
  STAGING_USER_EMAIL: ${{ secrets.STAGING_USER_EMAIL }}
  STAGING_USER_PASSWORD: ${{ secrets.STAGING_USER_PASSWORD }}
  # TMS Configuration (for Xray sync)
  # TMS modality. Only 'xray' has Test Executions to import into — a jira-native
  # project writes a per-Test status field instead, so the XrayImport job below
  # is skipped outright for it. A repo VARIABLE, not a secret: it is plain
  # configuration, and a job-level `if:` can read `vars` but never `secrets`.
  TMS_PROVIDER: ${{ vars.TMS_PROVIDER || 'xray' }}
  AUTO_SYNC: ${{ secrets.AUTO_SYNC || 'false' }}
  XRAY_CLIENT_ID: ${{ secrets.XRAY_CLIENT_ID }}
  XRAY_CLIENT_SECRET: ${{ secrets.XRAY_CLIENT_SECRET }}
  # Key of the Test Execution this run imports into. By default that is the RTR
  # (`RTR: {env}-{date}: Regression Testing`, one per verdict): /regression-testing
  # creates it BEFORE triggering this workflow, linked to the RTP and parented to
  # the "QA Test Artifacts" epic, and passes its key as the `execution_key`
  # dispatch input. The secret is the fallback for a scheduled run (no inputs on
  # a cron trigger), and it is the sprint-close STR only when the run IS the
  # sprint close. Never a Test Plan key: a Test Plan derives its status from its
  # Executions and is never written into. Empty = the XrayImport job below
  # skips, because importing with no target mints a new, unparented Execution
  # on every run. The name is kept for downstream secrets; the semantics moved.
  STP_EXECUTION_KEY: ${{ github.event.inputs.execution_key || secrets.STP_EXECUTION_KEY }}
  # Atlassian credentials — uncomment when AUTO_SYNC=true. Required by the
  # "Sync … Results to TMS" steps below on a jira-native project (TMS_PROVIDER=jira
  # writes a status field and a comment on each Test issue), and by the Xray
  # STP/STR diagnostic lookup. Also consumed by MCP, acli and xray-cli locally.
  # Add as repo Secrets first.
  #
  # There is NO ATLASSIAN_URL secret, on purpose. The site host is read from the
  # checked-out .agents/project.yaml (issue_tracker.atlassian_url) by
  # config/variables.ts, so a site migration needs no CI change and the workflow
  # cannot drift from the repo. A secret here would be a second copy of a value
  # that already lives in the tree — the exact thing that goes stale unnoticed.
  # ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
  # ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
  # Secret manager (ADVANCED, optional; ADR-0010). Only for a project that
  # committed .env.provider.schema: the service account reads the team vault
  # inside every step that runs through the launcher (`bun run test*`,
  # `test:env:check`, `test:sync`). It sits BESIDE the per-variable secrets
  # above, never instead: a per-variable secret that is set still wins, and one
  # left unset (an empty string here) is dropped by the launcher so it cannot
  # blank the vault value. Steps that call a tool directly (`bun xray`, the
  # portal publisher) still read the per-variable secrets only.
  OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

jobs:
  # ============================================
  # Job 1: Integration Tests (API only)
  # ============================================
  IntegrationTests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ github.event.inputs.environment || 'staging' }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Validate Test Environment Variables
        run: bun run test:env:check

      - name: Install Playwright (API context)
        run: bun run pw:install

      - name: Run Integration Tests on ${{ env.TEST_ENV }}
        run: bun run test:integration

      # The TMS write-back runs HERE, after the Playwright process has exited:
      # reports/atc_results.json is written by KataReporter.onEnd(), which fires
      # after the global-teardown project, so nothing inside the run can read it
      # (issue #27). `always()` so a failing suite still reports its results.
      #
      # Skipped for the xray modality on purpose: the XrayImport job below
      # imports this run's per-ATC results (reports/atc_results.json, uploaded
      # below) into the same Test Execution, and two imports of the same runs
      # is a double-import, not a safety net.
      - name: Sync Integration Results to TMS
        if: always() && env.AUTO_SYNC == 'true' && env.TMS_PROVIDER != 'xray'
        run: bun run test:sync

      - name: Upload Integration Allure Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-allure-results
          path: allure-results/
          retention-days: 10

      - name: Upload Integration Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: test-results/
          retention-days: 10

      # The per-ATC verdicts the XrayImport job imports, with the outcome
      # records that name an ATC whose test failed before it could record a
      # result. A separate artifact on purpose: adding these files to the
      # test-results upload would move junit.xml one level down inside it.
      - name: Upload Integration ATC Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-atc-results
          path: |
            reports/atc_results.json
            reports/test-outcomes.json
          if-no-files-found: ignore
          retention-days: 10

      - name: Cleanup Workspace
        if: always()
        run: |
          rm -rf node_modules
          rm -rf allure-results
          rm -rf test-results

  # ============================================
  # Job 2: E2E Tests (Browser)
  # Runs after Integration Tests complete
  # ============================================
  E2ETests:
    name: E2E Tests
    needs: IntegrationTests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: ${{ github.event.inputs.environment || 'staging' }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Validate Test Environment Variables
        run: bun run test:env:check

      - name: Install Playwright Browsers
        run: bun run pw:install

      - name: Run E2E Tests on ${{ env.TEST_ENV }}
        run: bun run test:e2e

      # The TMS write-back runs HERE, after the Playwright process has exited:
      # reports/atc_results.json is written by KataReporter.onEnd(), which fires
      # after the global-teardown project, so nothing inside the run can read it
      # (issue #27). `always()` so a failing suite still reports its results.
      #
      # Skipped for the xray modality on purpose: the XrayImport job below
      # imports this run's per-ATC results (reports/atc_results.json, uploaded
      # below) into the same Test Execution, and two imports of the same runs
      # is a double-import, not a safety net.
      - name: Sync E2E Results to TMS
        if: always() && env.AUTO_SYNC == 'true' && env.TMS_PROVIDER != 'xray'
        run: bun run test:sync

      - name: Upload E2E Allure Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-allure-results
          path: allure-results/
          retention-days: 10

      - name: Upload E2E Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 10

      # The per-ATC verdicts the XrayImport job imports, with the outcome
      # records that name an ATC whose test failed before it could record a
      # result. A separate artifact on purpose: adding these files to the
      # test-results upload would move junit.xml one level down inside it.
      - name: Upload E2E ATC Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-atc-results
          path: |
            reports/atc_results.json
            reports/test-outcomes.json
          if-no-files-found: ignore
          retention-days: 10

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-playwright-report
          path: playwright-report/
          retention-days: 10

      - name: Upload Failure Evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 10

      - name: Cleanup Workspace
        if: always()
        run: |
          rm -rf node_modules
          rm -rf allure-results
          rm -rf test-results
          rm -rf playwright-report

  # ============================================
  # Job 3: Build & Deploy Allure Report
  # Merges results from both test jobs
  # ============================================
  # NOTE: GitHub Pages is a temporary solution for hosting Allure reports.
  # For production, consider implementing a dedicated Test Portal with:
  # - Authentication and protected access
  # - API to upload Allure results to a database
  # - Centralized report management across projects
  # See: KATA Test Portal (future enhancement)
  # ============================================
  allure-report:
    name: Build & Deploy Allure Report
    needs: [IntegrationTests, E2ETests]
    runs-on: ubuntu-latest
    if: ${{ always() && github.event.inputs.generate_allure != 'false' }}

    steps:
      # Full repo checkout: the report is generated with the repo's own
      # allurerc.mjs + allure devDependency (identical to local runs).
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Get Allure History
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 1
        continue-on-error: true

      - name: Download Integration Allure Results
        id: download_integration
        uses: actions/download-artifact@v8
        with:
          name: integration-allure-results
          path: regression-artifacts/integration-allure-results
        continue-on-error: true

      - name: Download E2E Allure Results
        id: download_e2e
        uses: actions/download-artifact@v8
        with:
          name: e2e-allure-results
          path: regression-artifacts/e2e-allure-results
        continue-on-error: true

      - name: Merge Allure Results
        id: merge_results
        shell: bash
        env:
          INTEGRATION_OUTCOME: ${{ steps.download_integration.outcome }}
          E2E_OUTCOME: ${{ steps.download_e2e.outcome }}
        run: |
          # continue-on-error above lets a skipped test job pass; it also hides a
          # download-artifact v8 digest mismatch, so a failed download is named here.
          if [ "$INTEGRATION_OUTCOME" = "failure" ]; then
            echo "::warning title=Artifact not downloaded::integration-allure-results was not downloaded: absent, or its digest did not match the upload. See the Download step log."
          fi
          if [ "$E2E_OUTCOME" = "failure" ]; then
            echo "::warning title=Artifact not downloaded::e2e-allure-results was not downloaded: absent, or its digest did not match the upload. See the Download step log."
          fi
          mkdir -p merged-allure-results

          # Merge Integration results
          if [ -d "regression-artifacts/integration-allure-results" ] && [ -n "$(ls -A regression-artifacts/integration-allure-results 2>/dev/null)" ]; then
            echo "Merging Integration test results..."
            cp -r regression-artifacts/integration-allure-results/. merged-allure-results/
          else
            echo "No Integration results to merge."
          fi

          # Merge E2E results
          if [ -d "regression-artifacts/e2e-allure-results" ] && [ -n "$(ls -A regression-artifacts/e2e-allure-results 2>/dev/null)" ]; then
            echo "Merging E2E test results..."
            cp -r regression-artifacts/e2e-allure-results/. merged-allure-results/
          else
            echo "No E2E results to merge."
          fi

      - name: Check Allure Results
        id: check_allure
        shell: bash
        run: |
          if [ -d "merged-allure-results" ] && [ -n "$(ls -A merged-allure-results 2>/dev/null)" ]; then
            echo "Allure results found in merged-allure-results."
            echo "has_results=true" >> $GITHUB_OUTPUT
          else
            echo "No Allure results found. Skipping report generation."
            echo "has_results=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Merged Allure Results
        if: steps.check_allure.outputs.has_results == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: merged-allure-results-${{ env.TEST_ENV }}
          path: merged-allure-results/
          retention-days: 10

      - name: Setup Bun
        if: steps.check_allure.outputs.has_results == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        if: steps.check_allure.outputs.has_results == 'true'
        run: bun install

      # Allure 3 generate + publish: same allurerc.mjs as local (Awesome report
      # served directly, trends via historyPath), real retention, latest redirect.
      # PRIVATE portal mode is opt-in: when the PORTAL_URL secret is set, the
      # report goes to the auth-walled Test Report Portal (R2) INSTEAD of
      # public GitHub Pages. Runbook: .agents/skills/regression-testing/
      # references/private-hosting-setup.md
      - name: Build & Publish Allure Report (Allure 3)
        if: steps.check_allure.outputs.has_results == 'true'
        env:
          PORTAL_URL: ${{ secrets.PORTAL_URL }}
          PORTAL_PROJECT: ${{ secrets.PORTAL_PROJECT }}
          PORTAL_API_KEY: ${{ secrets.PORTAL_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          # Used only when this run bootstraps gh-pages (no gh-pages checkout yet):
          # publish-allure-pages.ts hands it to git push through the environment.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$PORTAL_URL" ]; then
            bun scripts/ci/publish-allure-portal.ts \
              --env "${{ env.TEST_ENV }}" --suite regression \
              --run "${{ github.run_number }}" \
              --results merged-allure-results
          else
            bun scripts/ci/publish-allure-pages.ts \
              --env "${{ env.TEST_ENV }}" --suite regression \
              --run "${{ github.run_number }}" \
              --results merged-allure-results --pages gh-pages --keep 10
            echo "## Allure Report" >> $GITHUB_STEP_SUMMARY
            echo "View the report: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ env.TEST_ENV }}/regression/" >> $GITHUB_STEP_SUMMARY
          fi

  # ============================================
  # Job 4: Import Results to Xray
  # ============================================
  # The write-back leg. Each test job uploads reports/atc_results.json (one
  # verdict per ATC, keyed by its @atc id, which IS the Test key), and this job
  # writes them into the Test Execution the QA process already created.
  #
  # IT NEVER CREATES A TEST. The import is Xray JSON with an explicit testKey
  # per entry and no testInfo; Xray creates a Test only from testInfo. The
  # junit.xml is NOT imported: Xray mints a new Generic Test for every JUnit
  # testcase without a test_key, and a Playwright testcase holds zero, one or
  # several ATCs (the setup and teardown projects land there with none). A Test
  # is created by /test-documentation behind a signed ROI verdict, never here.
  #
  # OPT-IN AND NON-BLOCKING BY CONSTRUCTION. This boilerplate is used by projects
  # with no TMS at all, so every gate below exits 0 with a GitHub annotation
  # instead of failing, and the import step is continue-on-error so an Xray
  # outage never turns a green suite red. A repo without Xray sees a skip note.
  # One exception, on purpose: once the import is enabled, a result whose id is
  # not a Test key, or a report that cannot be read or belongs to another run,
  # fails this job with one line naming it, before anything is sent. That is a
  # defect in the suite, not an outage.
  #
  # The modality gate is different in kind: it is not "Xray is misconfigured"
  # but "this project has no Xray", so it skips the whole job SILENTLY. A
  # jira-native repo must see no Xray annotation at all — an annotation about a
  # platform it does not use is noise that teaches the wrong model.
  # ============================================
  XrayImport:
    name: Import Results to Xray
    needs: [IntegrationTests, E2ETests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `always()` so results still reach the TMS after a failing suite. The
    # `vars` expression is repeated rather than read from `env.TMS_PROVIDER`:
    # a job-level `if:` cannot read the `env` context.
    if: always() && (vars.TMS_PROVIDER || 'xray') == 'xray'

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Download Integration ATC Results
        id: download_integration_atc
        uses: actions/download-artifact@v8
        with:
          name: integration-atc-results
          path: xray-artifacts/integration
        continue-on-error: true

      - name: Download E2E ATC Results
        id: download_e2e_atc
        uses: actions/download-artifact@v8
        with:
          name: e2e-atc-results
          path: xray-artifacts/e2e
        continue-on-error: true

      - name: Check the Xray Import Is Enabled
        id: gate
        shell: bash
        env:
          XRAY_CLIENT_ID: ${{ secrets.XRAY_CLIENT_ID }}
          XRAY_CLIENT_SECRET: ${{ secrets.XRAY_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          if [ "${AUTO_SYNC:-false}" != "true" ]; then
            echo "::notice title=Xray import skipped::AUTO_SYNC is not 'true', so no result reached the TMS. Set the AUTO_SYNC repo secret to 'true' to turn the write-back on."
            exit 0
          fi

          if [ -z "${XRAY_CLIENT_ID:-}" ] || [ -z "${XRAY_CLIENT_SECRET:-}" ]; then
            echo "::notice title=Xray import skipped::XRAY_CLIENT_ID / XRAY_CLIENT_SECRET are not configured as repo secrets."
            exit 0
          fi

          # No target key = no import. Importing with only a project key mints a
          # fresh Test Execution per run, and Xray's import API cannot parent it
          # to the "QA Test Artifacts" epic afterwards. Skipping beats orphaning.
          if [ -z "${STP_EXECUTION_KEY:-}" ]; then
            echo "::warning title=Xray import skipped::No execution key, so results were NOT imported. Set execution_key (the RTR key) when dispatching, or the STP_EXECUTION_KEY secret for scheduled runs; never the RTP/STP key. The target is a Test Execution under the 'QA Test Artifacts' epic."
            exit 0
          fi

          # A typo in the key is a configuration slip, not a suite defect: skip
          # with a warning naming it, never turn a green suite red.
          if ! [[ "${STP_EXECUTION_KEY}" =~ ^[A-Z][A-Z0-9_]+-[0-9]+$ ]]; then
            echo "::warning title=Xray import skipped::The execution key '${STP_EXECUTION_KEY}' is not a Test Execution key (PROJECT-123 shape), so results were NOT imported. Fix execution_key or the STP_EXECUTION_KEY secret."
            exit 0
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"

      # NOT continue-on-error: an id that is not a Test key fails the job here,
      # with one line naming it, and nothing reaches Xray. No ATC in the run =
      # a notice and no payload.
      - name: Build the Xray Payload and Check Every Test Key
        id: payload
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        env:
          INTEGRATION_OUTCOME: ${{ steps.download_integration_atc.outcome }}
          E2E_OUTCOME: ${{ steps.download_e2e_atc.outcome }}
        run: |
          set -euo pipefail
          # A failed download (absent, or a download-artifact v8 digest mismatch)
          # leaves that leg's verdicts out of the import: name it.
          if [ "$INTEGRATION_OUTCOME" = "failure" ]; then
            echo "::warning title=Artifact not downloaded::integration-atc-results was not downloaded, so its verdicts are not imported. See the Download step log."
          fi
          if [ "$E2E_OUTCOME" = "failure" ]; then
            echo "::warning title=Artifact not downloaded::e2e-atc-results was not downloaded, so its verdicts are not imported. See the Download step log."
          fi
          bun run --silent xray:payload --execution "${STP_EXECUTION_KEY}" --out xray-results.json \
            xray-artifacts/integration/atc_results.json xray-artifacts/e2e/atc_results.json
          if [ -f xray-results.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Import Results to Xray
        if: steps.payload.outputs.ready == 'true'
        continue-on-error: true
        shell: bash
        env:
          XRAY_CLIENT_ID: ${{ secrets.XRAY_CLIENT_ID }}
          XRAY_CLIENT_SECRET: ${{ secrets.XRAY_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          bun xray auth login
          echo "Importing $(jq '.tests | length' xray-results.json) ATC result(s) into ${STP_EXECUTION_KEY}..."
          bun xray import xray --file xray-results.json

          echo "## Xray Import" >> $GITHUB_STEP_SUMMARY
          echo "Imported $(jq '.tests | length' xray-results.json) ATC result(s) into Test Execution \`${STP_EXECUTION_KEY}\` (the RTR for this run, or the sprint-close STR), one per existing Test key; the import carries no testInfo, so it cannot create a Test. Set execution_key when dispatching, or the STP_EXECUTION_KEY secret for scheduled runs; never the RTP/STP key." >> $GITHUB_STEP_SUMMARY

