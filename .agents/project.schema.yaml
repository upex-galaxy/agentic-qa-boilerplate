# GENERATED by `bun run agents:schema` from .agents/project.yaml. DO NOT EDIT BY HAND.
#
# This is the TEMPLATE a consumer project is compared against, not a file any
# project reads at runtime. `bun run up` diffs a project's own
# .agents/project.yaml against this one and reports the key paths upstream has
# added since that project was scaffolded; `bun run setup:doctor` reports the
# same thing as a diagnosis. Values here are methodology defaults or `null`
# placeholders — never the maintainer's identity, which `agents:schema`
# refuses to emit.
#
# To change it: edit .agents/project.yaml, then run `bun run agents:schema`.
# `bun run agents:schema:check` fails the commit when the two disagree.

project:
  project_name: null # TODO: Project name (e.g. MyProject)
  project_key: null # TODO: Project key in issue tracker (e.g. PROJ, ACME, UPEX). The boilerplate ships this `null` on purpose — the consumer project fills it; never hardcode a real key here.
  webapp_domain: null # TODO: Domain of the web application under test (e.g. myproject.com)

backend:
  backend_repo: null # TODO: Relative path to backend repository (e.g. ../my-backend)
  backend_stack: null # TODO: Backend technology stack (e.g. Node.js + Express)
  backend_entry: null # TODO: Backend source entry point (e.g. src/)

frontend:
  frontend_repo: null # TODO: Relative path to frontend repository (e.g. ../my-frontend)
  frontend_stack: null # TODO: Frontend technology stack (e.g. React + TypeScript)
  frontend_entry: null # TODO: Frontend source entry point (e.g. src/)

database:
  db_type: null # TODO: Database engine (e.g. PostgreSQL)

issue_tracker:
  issue_tracker: null # TODO: Issue tracking tool (e.g. Jira)
  issue_tracker_cli: null # TODO: CLI command to query tickets (e.g. acli (Jira) / gh issue (GitHub))
  # SOURCE OF TRUTH for the Atlassian instance. Every jira:sync-* script resolves the
  # host from HERE first and uses .env's ATLASSIAN_URL only as a fallback (see
  # cli/lib/atlassian-instance.ts). Inverse of project_key, on purpose: the host is
  # project identity, not a per-developer override, and it is the value that goes stale
  # after a site migration — a stale host silently overwrites .context/PBI/ and the
  # .agents/*.json catalogs with another site's content. Keep it identical to .env's
  # ATLASSIAN_URL; when they disagree the yaml wins and the scripts print a warning.
  atlassian_url: null # TODO: Atlassian site base URL (e.g. https://company.atlassian.net)

testing:
  default_env: null # TODO: Default testing environment — must match a key under `environments:` (e.g. staging)
  tms_cli: null # TODO: Test management CLI command (e.g. bun xray)
  # Which stage turns a test case into a `Test` work item in the TMS. One of:
  # auto | sprint-testing | test-documentation. `auto` (the shipped default) follows the
  # TMS modality resolved from `tms_cli`: jira-xray -> /sprint-testing Stage 1 (Xray's
  # `Test` IS the execution unit, so the item must exist during the sprint for the Test
  # Execution, coverage panel and Test Plan membership to work); jira-native -> Stage 4
  # /test-documentation (a native `Test` issue IS documentation, so creating one per sprint
  # outline fills the regression repository with cases that were never ROI-gated).
  # Override only when the project weighs repository cleanliness against in-sprint
  # traceability differently — the cost of each override is stated in
  # `.agents/skills/sprint-testing/SKILL.md` §"Which stage creates the TCs".
  # Read as {{TC_CREATION_STAGE}}; unset or unrecognized is treated as `auto`.
  tc_creation_stage: auto

qa:
  formal_blocked_gate: true # When true and the substrate exposes a `blocked` story status, FAILED stories dispatch `defect_reported` (in_test -> blocked). When false (or no `blocked` slug), the skill leaves the story in `in_test` with the linked bug — non-strict fallback. See sprint-testing/references/sprint-orchestration.md Briefing 4 Step 5.
  # Jira LABEL that marks an Epic as a QA-artifact bucket rather than a product Epic.
  # `sync-jira-issues` keeps labelled Epics out of `.context/PBI/epics/` (which is the product
  # tree, one folder per Epic with its Stories nested) and indexes them in `qa-artifacts/`
  # instead. Without it, `QA Test Repository` and friends land beside real product Epics as
  # near-empty folders, because a Story query against them returns nothing.
  # A label is used rather than the epic name because a product Epic may legitimately start
  # with "QA ", and rather than the cached `qa_epics.*.key` below because those are `null`
  # until a skill discovers them — the label works from the first sync.
  # Whoever creates a QA-artifact Epic must apply it; the AI does so automatically.
  qa_artifact_label: QA-Artifact
  # QA process epics — buckets that hold QA artifacts so they never pollute product epics/roadmap.
  # FOUR QA-process epics form the QA-governance cluster: Test Plans parent to `master_test_plan_epic`;
  # Test (TC) issues parent to `test_repository_epic`; Test Executions/Preconditions/Test Sets parent to
  # `test_artifacts_epic`; Bug/Defect/Improvement parent to `defect_epic`.
  # Skills resolve the epic by NAME (the methodology convention shipped below) and find-or-create it,
  # caching the discovered `*.key` here. NEVER parent a quality issue to a product/dev epic.
  # Read directly by skills (not {{VAR}} tokens) → skipped by vars:check, like git_strategy leaves.
  # Doctrine: .agents/skills/agentic-qa-core/references/defect-management-doctrine.md (Part 4).
  qa_epics:
    master_test_plan_epic:
      name: QA Master Test Plan # the MTP — parent of every Test Plan (FTP/STP/ATP and the long-lived RTP); description mirrors
      # .context/master-test-plan.md + points to the official QA repo; cross-linked to the 3 sibling QA epics
      key: null # discovered/created at runtime, then cached here (e.g. PROJ-100)
    test_repository_epic:
      name: QA Test Repository # convention name; holds every Test (TC) issue
      key: null # discovered/created at runtime, then cached here (e.g. PROJ-456)
    test_artifacts_epic:
      name: QA Test Artifacts # holds every Test Execution (STR/ATR and the per-verdict RTR), Precondition, Test Set
      key: null # discovered/created at runtime, then cached here (e.g. PROJ-789)
    defect_epic:
      name: QA Defect Management # convention name; the `QA ` prefix marks a process epic, not product
      key: null # discovered/created at runtime, then cached here (e.g. PROJ-123)

# Git workflow for THIS project — the SOURCE OF TRUTH read by the git-flow-master skill
# before any git/gh operation. Ships `strategy: solo-main` as an inherited DEFAULT, not a
# decision — `meta.strategy_source` records the difference (`inherited` until the Strategy
# Setup questionnaire actually runs and stamps `chosen`). Tracked + frozen by the
# updater (bootstrapOnly), so each project keeps its own. Filled by git-flow-master, NOT by
# `agents:setup`. These leaves are read directly (not {{VAR}} template vars) → skipped by vars:check.
git_strategy:
  strategy: solo-main # DEFAULT, not a decision — see meta.strategy_source. One of: solo-main | main-integration | enterprise | trunk-based | gitflow | github-flow | gitlab-flow | sdet
  description: >
    TODO: describe this project's branching strategy in prose — which branches are
    long-lived, how work reaches the release branch, and any operational note the AI
    needs before it runs a git command. Filled by the git-flow-master Strategy Setup
    questionnaire, or by hand.
  branches:
    production: main # release / default branch
    integration: null # long-lived integration branch name (e.g. staging), or null
    ephemeral_pattern: null # on-demand trunk pattern (e.g. "test/<module>-suite" for sdet), or null
  protected: [main] # branches that are never force-pushed and never rewritten (AGENTS.md Critical Rule #6). Add the integration branch here too when the strategy has one.
  decisions: # captured by the Strategy Setup questionnaire (Q1/Q2/Q3)
    promote_method: n/a # ff-only | merge-commit | squash | n/a
    feature_merge: n/a # merge-commit | squash | rebase-merge | n/a
    hotfix_policy: n/a # branch-off-prod-backmerge | via-integration | none | n/a
  policy: # how strictly protected branches are guarded (set by Strategy Setup Q4; defaults are safe)
    direct_push_to_protected: confirm # forbidden | confirm | allowed. Ships `confirm` because meta.strategy_source is `inherited`: until Strategy Setup runs, nobody has authorized a direct push here.
    admin_bypass: false # true only when the push credential is on the host ruleset's bypass list. While false, a "Bypassed rule violations" line from the remote is a real finding, not noise.
    require_pr_reviews: 1 # required approving reviews on a protected branch. Reconcile against the host with `bun run git:policy verify`.
    # Host divergences that are ACCEPTED, not drift. Each `field` names a `git:policy verify`
    # finding verbatim (`<branch>.<policy_field>`); verify moves matching findings from DRIFT
    # to ACCEPTED (exit 0) and warns when an entry no longer matches anything (stale entry).
    # `apply` preserves the host's side for accepted fields instead of deriving its own rule.
    accepted_divergences: []
  branch_prefixes:
    precedence: [feat, fix, refactor, test, docs, chore]
    naming_with_key: '{prefix}/{ISSUE-KEY}-{kebab-slug}'
    naming_without_key: '{prefix}/{kebab-slug}'
  meta:
    setup_version: 1
    created: null # YYYY-MM-DD stamped by Strategy Setup
    policy_verified: null # YYYY-MM-DD of the last `bun run git:policy verify`. null = never reconciled against the host
    policy_source: declared # verified | accepted | declared. `verified` = host matches the yaml exactly; `accepted` = every divergence is formally listed in policy.accepted_divergences (stamped by `git:policy verify --stamp`); `declared` = never reconciled, or an unaccepted drift is open.
    # Did anyone actually CHOOSE this strategy, or is it just the shipped default?
    # `strategy:` above is never null, so its value alone cannot answer that. Strategy
    # Setup flips this to `chosen` when the questionnaire actually runs.
    strategy_source: inherited # inherited | chosen

# Defaults for multi-session orchestration (supervised worker fleets via Orca —
# see the orca-orchestration skill). Owned by that skill; read directly, NOT
# {{VAR}} template references in the section-prefixed sense (leaves resolve as
# flat {{VAR}} names like every other top-level section — see .agents/README.md
# §"orchestration" for the exact declared names). An explicit user instruction
# in the conductor session ALWAYS overrides these defaults for that run; they
# apply only when the user says nothing.
orchestration:
  max_workers: 4 # concurrent workers per round
  default_agent: claude # claude | codex | opencode
  default_model: '' # full provider model id; empty = the harness default
  default_effort: high # harness effort level when supported
  # WHICH orchestrator, named here instead of hardcoded in a skill. Empty
  # `orchestrator_cli` = no orchestrator on this machine: every workflow skill
  # falls back to the pasted-launch-line path and says NOTHING about it.
  orchestrator_name: Orca # the application the operator sees
  orchestrator_cli: orca # the binary on PATH (Linux outside a managed terminal: orca-ide)
  # THE TWO VERBS ARE NOT INTERCHANGEABLE, and this is the pair that the
  # channel-discipline doctrine exists to keep apart.
  # `message_verb` carries every message BETWEEN sessions. Byte-intact.
  # `terminal_verb` DRIVES a terminal: commands, CLI calls, harness
  #   slash-commands, keystrokes. It truncates a long payload silently, keeps
  #   only the TAIL, and still reports success — so the damage reads like a
  #   typo rather than a missing message.
  # The test: if a HUMAN would read it, it does not go through `terminal_verb`.
  # If a shell or a TUI would EXECUTE it, that is what the verb is for.
  # One structural exception: a supervised worker's FIRST prompt must go
  # through `terminal_verb`, because the native launch has no argv. Keep it
  # short and pointing at a file.
  message_verb: orca orchestration # session-to-session messages ONLY
  terminal_verb: orca terminal # commands and keystrokes ONLY
  # Vendor skills the orchestrator installs at USER level. Loaded ALONGSIDE
  # this repo's own `orca-orchestration` skill, never instead of it: the repo
  # skill owns WHEN and WHAT, these own the command grammar. They are small
  # enough to load rather than fetch on demand. Empty list = none installed;
  # the repo skill then asks the binary for its grammar.
  # Measurements and dates: orca-orchestration/references/channel-discipline.md.
  orchestrator_skills: [orca-cli, orchestration]

# Files `bun run up` must keep as THIS project's own. Read by `cli/update-boilerplate.ts`
# at the start of every run and merged into the protected watchlist (AGENTS.md,
# .agents/project.yaml, .mcp.json, opencode.jsonc, .codex/config.toml,
# .claude/settings.json, .husky/pre-commit, .husky/pre-push, allurerc.mjs,
# playwright.config.ts, the KATA bases under tests/components/, ...): a listed path is
# never overwritten, is delivered once from upstream when missing, and shows a drift row
# with hunk evidence when upstream's copy changes. List a SYNCED file you merged by hand
# (the parity row "project edit overwritten" names the path to add); repo-relative FILE
# paths only, no directories, nothing under .git. An invalid entry is reported and
# ignored. Empty by default. Read directly by the updater (not a {{VAR}} source): the
# nested list is skipped by vars:check like git_strategy and qa.qa_epics.
updater:
  protected_paths: [] # e.g. [scripts/lint-vars.ts, .agents/skills/acli/SKILL.md]

# Per-environment config. Add/remove environments freely (production, dev, qa, uat, etc.).
# Each environment must define ALL four keys: web_url, api_url, db_mcp, api_mcp.
# Skills referencing {{WEB_URL}} / {{API_URL}} / {{DB_MCP}} / {{API_MCP}} resolve to the
# active environment (`testing.default_env` above, or a session override).
# For explicit cross-env references use {{environments.<env>.<var>}} (e.g. {{environments.local.web_url}}).
environments:
  local:
    web_url: null # TODO: Frontend URL for local env (e.g. http://localhost:3000)
    api_url: null # TODO: API base URL for local env (e.g. http://localhost:3000/api)
    db_mcp: null # TODO: MCP server name for local DB (e.g. myproject-local-db)
    api_mcp: null # TODO: MCP server name for local API (e.g. myproject-local-api)
  qa:
    web_url: null # TODO: Frontend URL for qa env (e.g. https://qa.myproject.com)
    api_url: null # TODO: API base URL for qa env (e.g. https://api-qa.myproject.com)
    db_mcp: null # TODO: MCP server name for qa DB (e.g. myproject-qa-db)
    api_mcp: null # TODO: MCP server name for qa API (e.g. myproject-qa-api)
  staging:
    web_url: null # TODO: Frontend URL for staging env (e.g. https://staging.myproject.com)
    api_url: null # TODO: API base URL for staging env (e.g. https://api-staging.myproject.com)
    db_mcp: null # TODO: MCP server name for staging DB (e.g. myproject-staging-db)
    api_mcp: null # TODO: MCP server name for staging API (e.g. myproject-staging-api)
  production:
    web_url: null # TODO: Frontend URL for production env (e.g. https://myproject.com)
    api_url: null # TODO: API base URL for production env (e.g. https://api.myproject.com)
    db_mcp: null # TODO: MCP server name for production DB (e.g. myproject-production-db)
    api_mcp: null # TODO: MCP server name for production API (e.g. myproject-production-api)
