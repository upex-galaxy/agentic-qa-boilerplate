# MAINTAINER COPY: the boilerplate's own filled values, documented in .agents/project.schema.yaml; `bun run agents:setup` reseeds a copy made with "Use this template".

project:
  project_name: Bunkai
  project_key: BK
  webapp_domain: upexbunkai.vercel.app

backend:
  backend_repo: ../../bunkai/upex-bunkai-tms
  backend_stack: Next.js + Supabase + Vercel
  backend_entry: ../../bunkai/upex-bunkai-tms/.

frontend:
  frontend_repo: ../../bunkai/upex-bunkai-tms
  frontend_stack: Next.js
  frontend_entry: ../../bunkai/upex-bunkai-tms/.

database:
  db_type: Supabase Postgres

issue_tracker:
  issue_tracker: Jira
  issue_tracker_cli: acli
  atlassian_url: https://upexgalaxy74.atlassian.net

testing:
  default_env: staging
  tms_cli: bun xray
  tc_creation_stage: auto
  browser:
    pair_mode: null

harnesses: [claude, opencode, codex]

qa:
  formal_blocked_gate: true
  qa_artifact_label: QA-Artifact
  qa_epics:
    master_test_plan_epic:
      name: QA Master Test Plan
      key: BK-514
    test_repository_epic:
      name: QA Test Repository
      key: BK-70
    test_artifacts_epic:
      name: QA Test Artifacts
      key: BK-515
    defect_epic:
      name: QA Defect Management
      key: BK-183
  methodology:
    stages: [shift-left, planning, execution, reporting, documentation, automation, regression]
    gate_mode: strict
    execution_profile: agentic

board:
  source: auto
  tickets_file: .context/sprint/tickets.yaml
  jql: project = BK AND sprint in openSprints() AND issuetype = Story
  bug_jql: null
  ticket_key_pattern: null
  timezone: null
  statuses:
    tickets:
      not_ready: [backlog, shift_left_qa, ready_for_dev, to_do, in_progress, in_review]
      in_test: [ready_for_qa, in_test]
      tested: [qa_approved, ready_for_release, deployed_to_production, fixed, automated, completed]
      blocked: [blocked]
      dropped: [aborted]
    bugs:
      open: [open, in_progress, in_review, deferred]
      fixed: [ready_for_qa]
      resolved: [closed]
      discarded: [cannot_reproduce, enhancement, duplicated, rejected, aborted]
    tests:
      PASSED: [PASSED, passed]
      FAILED: [FAILED, failed]
      NOT RUN: [TODO, EXECUTING, ABORTED, n_r]
      BLOCKED: [blocked]
      DEFERRED: []
  people: []
  evidence:
    allowed_hosts: [claude.ai]
  brand:
    name: null
    logo: null

git_strategy:
  strategy: solo-main
  description: >
    Single long-lived branch (main); single maintainer (this repo is the boilerplate
    template itself). Work is committed and pushed DIRECTLY to main — never via a PR, and
    without asking the user to confirm each push (standing authorization). Every push to
    main is effectively a release of the template. No integration branch, no promotion
    path, no hotfix ceremony.
    Operational note for the AI: the GitHub ruleset "ProtectPublic" (require-PR +
    required-signatures on main/staging/dev) is bypassed AUTOMATICALLY on `git push`
    because the push credential is a repo/org admin — there is NO explicit bypass flag to
    add; a plain `git push origin main` already applies it. The remote line
    "Bypassed rule violations ... Changes must be made through a pull request" is EXPECTED
    and harmless. Do NOT open a PR, do NOT try to satisfy the rule, do NOT ask to confirm —
    just commit and push.
  branches:
    production: main
    integration: null
    ephemeral_pattern: null
  protected: [main]
  decisions:
    promote_method: n/a
    feature_merge: n/a
    hotfix_policy: n/a
  policy:
    direct_push_to_protected: allowed
    admin_bypass: true
    require_pr_reviews: 1
    accepted_divergences:
      - field: main.direct_push_to_protected
        enforced: blocked (pull_request rule)
        accepted: 2026-08-21
        reason: >
          The ProtectPublic ruleset requires a PR so non-bypass contributors cannot push
          main directly; this repo's admin credential is on the bypass list and pushes
          directly (standing authorization — see description). `allowed` describes how
          work actually lands here; the host rule keeps protecting everyone else. Both
          sides are correct on purpose.
  branch_prefixes:
    precedence: [feat, fix, refactor, test, docs, chore]
    naming_with_key: '{prefix}/{ISSUE-KEY}-{kebab-slug}'
    naming_without_key: '{prefix}/{kebab-slug}'
  meta:
    setup_version: 1
    created: 2026-06-20
    policy_verified: 2026-08-21
    policy_source: accepted
    strategy_source: chosen

orchestration:
  max_workers: 4
  default_agent: claude
  default_model: claude-sonnet-5-5
  default_effort: medium
  conductor_model: claude-opus-5-5
  conductor_effort: high
  subagent_model: sonnet
  permission_modes:
    conductor: auto
    worker: bypass
    subagent: inherit
  model_overrides:
    - topics: [security, auth, migration, rollback, architecture]
      tier: worker
      model: claude-opus-5-5
      effort: high
  orchestrator_name: Orca
  orchestrator_cli: orca
  message_verb: orca orchestration
  terminal_verb: orca terminal
  orchestrator_skills: [orca-cli, orchestration]

updater:
  protected_paths: []
  declined_denies: []
  declined_hooks: []

secrets:
  provider: local
  onepassword:
    vault: null
    account: null
    auth: app

environments:
  local:
    web_url: http://localhost:3000
    api_url: http://localhost:3000/api
    db_mcp: dbhub
    api_mcp: openapi
  qa:
    web_url: null
    api_url: null
    db_mcp: null
    api_mcp: null
  staging:
    web_url: https://staging-upexbunkai.vercel.app
    api_url: https://staging-upexbunkai.vercel.app/api
    db_mcp: dbhub
    api_mcp: openapi
  production:
    web_url: null
    api_url: null
    db_mcp: null
    api_mcp: null
